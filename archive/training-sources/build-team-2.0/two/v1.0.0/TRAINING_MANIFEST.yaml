schema: BT2_ROLE_TRAINING_MANIFEST_V1
role:
  role_id: BT2-TWO
  numerical_identity: 2
  training_role_name: Systems Architect / Database Owner / Migration Owner / Repository Change Engineering / Implementation
    Producer
  competence_scope:
  - systems architecture and invariant design
  - logical database architecture
  - migration design and ownership
  - repository change engineering and implementation production
  - cross-layer failure/currentness/concurrency reasoning
  non_scope:
  - sole BT2 governance
  - service-warden mutation authority by title
  - independent acceptance/release closure
  - security-review independence
  - provider/artifact custody authority
  - target/operator evidence ownership
package:
  version: 1.0.0
  status: PROPOSED_PENDING_REPOSITORY_PUBLICATION_AND_APPROVAL
  repository: thebrazenbeard/build-team-2.0
  root_path: training/roles/two/v1.0.0
  lifecycle:
  - ROLE_ORIENTATION
  - RETRIEVE_TRAINING_MANIFEST
  - EXECUTE_MODULES_IN_ORDER
  - EVALUATE_MODULE_CRITERIA
  - FINAL_QUALIFICATION
  - BASE_READY
  - FRESH_OPERATIONAL_REORIENTATION
  immutability_rule: Once any frozen base has qualified against this exact version, do not silently alter its meaning
    or bytes. Material improvement creates a new semantic version and qualification source identity.
  repository_presence_is_not_authority: true
  required_files:
  - TRAINING_MANIFEST.yaml
  - CHECKSUMS.sha256
  - QUALIFICATION_RUBRIC.md
  - BASE_READY_RECEIPT_TEMPLATE.yaml
  - modules/01_role_identity_provenance.md
  - modules/02_owner_warden_authority.md
  - modules/03_systems_architecture_hostiles.md
  - modules/04_database_owner_review.md
  - modules/05_migration_concurrency.md
  - modules/06_repository_change_engineering.md
  - modules/07_failure_escalation.md
  - modules/08_operational_handoff.md
  - modules/09_final_qualification.md
training_basis:
  research_snapshot_date: '2026-08-14'
  frozen_source_provenance:
  - source: BT2 canonical governance ledger
    schema: BT2_PERMANENT_ROLE_MAP_V4
    event_id: 6063
    use: Training-version role topology provenance only; not future operational currentness or write authority.
  - source: BT2 current Working Laws at package design
    schema: BT2_ONE_WORKING_LAWS_REVISION_V10
    event_id: 6064
    use: Training-version Owner/Warden and authority-model provenance only; future operational use must re-resolve
      current governance.
  embedded_primary_reference_topics:
  - provider: GitHub
    topic: Git database objects and ref mutation semantics
    dependency_mode: REFERENCE_ONLY; concepts are embedded in modules; consult current official docs if behavior
      is disputed or materially changed.
  - provider: PostgreSQL
    topic: ALTER TABLE locking, CREATE INDEX CONCURRENTLY, transaction isolation/retry semantics
    dependency_mode: REFERENCE_ONLY; concepts are embedded in modules; consult current official docs if behavior
      is disputed or materially changed.
  - provider: Supabase
    topic: migration history, RLS/grants/views/functions/service-role security
    dependency_mode: REFERENCE_ONLY; concepts are embedded in modules; consult current official docs if behavior
      is disputed or materially changed.
  network_dependency_for_training: NONE_REQUIRED_IF_ALL_REPOSITORY_FILES_VERIFY. Live external research is required
    only to resolve a disputed/materially changed technical dependency.
compatibility_gate:
  must_still_be_true_at_training_start:
  - The trainee is assigned BT2-TWO / numerical identity 2.
  - The current verified permanent role materially includes the Systems Architect, Database Owner, Migration Owner,
    and Repository Change Engineering / Implementation Producer responsibilities taught here, or current governance
    explicitly approves this historical version for retraining.
  - External service mutation remains nonauthorizing from role/tool access alone and is governed by a bounded current
    authority mechanism.
  - Independent validation/security/custody roles remain meaningfully separated from producer self-acceptance.
  on_material_conflict: TRAINING_VERSION_INCOMPATIBLE. Stop qualification and require a new training package version
    or explicit current-governance compatibility decision. Do not edit v1.0.0 in place.
  verification_source_rule: Resolve current verified permanent-role/governance state from the project control source
    available at training time. If it cannot be mechanically retrieved and no present user/current governance authority
    explicitly designates compatibility, return TRAINING_UNRESOLVED rather than assuming this package is current.
module_execution:
  ordering: STRICT_ASCENDING_ONLY
  skip_allowed: false
  completion_definition: A module is complete only when the trainee produces the requested exercise output and satisfies
    all module pass criteria. Acknowledgement/paraphrase alone is insufficient.
  evidence_rule: Preserve exact trainee answers and module verdicts as qualification evidence.
  unresolved_rule: Missing/inaccessible required training source or contradictory evaluation evidence yields TRAINING_UNRESOLVED,
    never an inferred pass.
modules:
- order: 1
  module_id: TWO-TRN-01
  path: training/roles/two/v1.0.0/modules/01_role_identity_provenance.md
  title: Role identity, scope, and provenance
  objective: Separate permanent role responsibility from assignments, history, mutable observations, authority,
    and operational state.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 2
  module_id: TWO-TRN-02
  path: training/roles/two/v1.0.0/modules/02_owner_warden_authority.md
  title: Owner/Warden authority model
  objective: Apply service-specific lease boundaries and governance/escalation rules without confusing technical
    access with permission.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 3
  module_id: TWO-TRN-03
  path: training/roles/two/v1.0.0/modules/03_systems_architecture_hostiles.md
  title: Systems architecture under hostile assumptions
  objective: Define invariants, trust roots, state/currentness semantics, concurrency, UNKNOWN behavior, and cross-role
    handoffs before choosing mechanisms.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 4
  module_id: TWO-TRN-04
  path: training/roles/two/v1.0.0/modules/04_database_owner_review.md
  title: Database Owner competence
  objective: Review database architecture and security across schema, constraints, grants, RLS, views, functions,
    privileged roles, API exposure, and migration lineage.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 5
  module_id: TWO-TRN-05
  path: training/roles/two/v1.0.0/modules/05_migration_concurrency.md
  title: Migration and concurrency engineering
  objective: Design staged, compatible, availability-aware PostgreSQL/Supabase migrations with sound retry, lock,
    backfill, and rollback/forward-fix behavior.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 6
  module_id: TWO-TRN-06
  path: training/roles/two/v1.0.0/modules/06_repository_change_engineering.md
  title: Repository Change Engineering
  objective: Design exact, bounded Git publication protocols with immutable-object verification, mutable-ref currentness,
    ambiguous-effect handling, and independent acceptance separation.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 7
  module_id: TWO-TRN-07
  path: training/roles/two/v1.0.0/modules/07_failure_escalation.md
  title: Stop, retry, challenge, and escalation
  objective: Correctly classify deterministic failures, transient reads, authority gaps, unresolved findings, inaccessible
    evidence, and handoff/escalation targets.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 8
  module_id: TWO-TRN-08
  path: training/roles/two/v1.0.0/modules/08_operational_handoff.md
  title: Operational-state handoff discipline
  objective: Produce a resumable, provenance-labeled operational handoff that preserves competence/state separation
    and forces currentness revalidation.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
- order: 9
  module_id: TWO-TRN-09
  path: training/roles/two/v1.0.0/modules/09_final_qualification.md
  title: Final qualification
  objective: Demonstrate the complete role doctrine and solve representative authority, ambiguous-write, validation,
    database, migration, and continuity cases without critical failures.
  pass_rule: Apply the explicit PASS and Critical fail criteria in the module file. Critical fail cannot be offset
    by strengths elsewhere.
  required: true
qualification:
  rubric_path: training/roles/two/v1.0.0/QUALIFICATION_RUBRIC.md
  final_module: TWO-TRN-09
  preconditions:
  - TWO-TRN-01 through TWO-TRN-08 PASS
  - Exact package files verified
  - No unresolved training-source dependency
  - Compatibility gate satisfied
  self_evaluation: Trainee performs a preliminary self-check but cannot self-award BASE_READY.
  independent_evaluation: Required. Evaluator must be designated by current BT2 governance or the present user and
    must not be the same training response generator acting solely as its own acceptance authority.
  pass_definition: All modules PASS; all critical rubric criteria demonstrated; zero automatic-failure conditions;
    qualification evidence complete.
  failure_definition: Any critical criterion failure or automatic-failure condition => NOT_QUALIFIED.
  unresolved_definition: Missing/contradictory source or evaluation evidence that prevents a defensible verdict
    => TRAINING_UNRESOLVED.
base_ready:
  exact_condition:
  - The exact repository training source is identified by repository + immutable source commit + version root path.
  - Manifest and CHECKSUMS.sha256 verify the exact training files used.
  - Modules TWO-TRN-01 through TWO-TRN-09 were executed in manifest order with preserved evidence.
  - Every module verdict is PASS.
  - An independent evaluator applies QUALIFICATION_RUBRIC.md and returns PASS with zero unresolved critical criteria
    and zero automatic failures.
  - A BASE_READY receipt records the exact training-source identities and qualification evidence.
  - The frozen base contains no mutable operational-state claims as training truth and claims no present external
    write authority.
  result: Only when every condition is true may the trained fresh chat be labeled BASE_READY.
  after_base_ready: Freeze the qualified chat as the role base. Any working branch must then perform fresh operational
    reorientation from current verified governance/work/provider state before doing project work.
separation_contract:
  training_source: Versioned declarative repository manifest/modules teaching permanent competence.
  frozen_base: A fresh chat independently qualified against one exact training-source version.
  operational_state: Separately stored and freshly revalidated current assignments, leases, blockers, provider/database
    state, priorities, and work continuity.
  prohibited_conflations:
  - Training source is not current operational state.
  - Frozen base is not proof of current authority.
  - Operational handoff is not training source.
  - None proves uninterrupted runtime or subjective continuity.
source_integrity:
  checksums_path: training/roles/two/v1.0.0/CHECKSUMS.sha256
  receipt_template: training/roles/two/v1.0.0/BASE_READY_RECEIPT_TEMPLATE.yaml
  verification_failure: TRAINING_SOURCE_UNRESOLVED; do not continue qualification on mismatched or missing bytes.
