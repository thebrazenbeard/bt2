name: Five-system scoped retrieval evidence
on:
  pull_request:
    paths:
      - 'portfolio/integration/five_systems/**'
      - '.github/workflows/five-system-retrieval-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio/integration/five_systems/**'
      - '.github/workflows/five-system-retrieval-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inert-evidence:
    name: scoped-contract-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify scoped retrieval and frozen diagnostic receipts
        run: python -m unittest discover -s portfolio/integration/five_systems/tests -p 'test_*.py' -v
