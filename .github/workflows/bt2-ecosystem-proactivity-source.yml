name: BT2 Ecosystem Proactivity Source Tests

on:
  pull_request:
    paths:
      - 'tools/ecosystem_proactivity/**'
      - '.github/workflows/bt2-ecosystem-proactivity-source.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ecosystem_proactivity/**'
      - '.github/workflows/bt2-ecosystem-proactivity-source.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # immutable v4
      - name: Python and source checks
        working-directory: tools/ecosystem_proactivity
        run: |
          python3 --version
          python3 -B -m unittest discover -s tests -v
          python3 -OB -m unittest discover -s tests -q
          python3 -B demo.py
