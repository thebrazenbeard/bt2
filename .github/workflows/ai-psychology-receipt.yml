name: AI psychology receipt source tests
on:
  pull_request:
    paths:
      - 'tools/ai_psychology/**'
      - 'docs/bt2/AI_PSYCHOLOGY_EVALUATION_RECEIPT_V1.md'
      - 'docs/bt2/AI_PSYCHOLOGY_PAIRED_FORECAST_V1.md'
      - '.github/workflows/ai-psychology-receipt.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ai_psychology/**'
      - 'docs/bt2/AI_PSYCHOLOGY_EVALUATION_RECEIPT_V1.md'
      - 'docs/bt2/AI_PSYCHOLOGY_PAIRED_FORECAST_V1.md'
      - '.github/workflows/ai-psychology-receipt.yml'
permissions:
  contents: read
jobs:
  receipt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify research-only evaluation and paired scoring
        run: python -m unittest discover -s tools/ai_psychology/tests -p 'test_*.py' -v
      - name: Syntax validation
        run: python -m compileall -q tools/ai_psychology
