name: Export Intake Source Contracts

on:
  pull_request:
    paths:
      - 'source_recovery/**'
      - '.github/workflows/export-intake-contract.yml'
  push:
    branches: [main]
    paths:
      - 'source_recovery/**'
      - '.github/workflows/export-intake-contract.yml'

permissions:
  contents: read

jobs:
  local-only-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run source-only intake tests
        run: python -m unittest discover -s source_recovery/tests -p 'test_*.py' -v
