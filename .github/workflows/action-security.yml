name: Workflow Action Security

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'

permissions:
  contents: read

jobs:
  action-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify immutable action refs and minimum token permissions
        run: python -m unittest discover -s .github/tests -p 'test_workflow_action_pinning.py' -v
