name: Workflow Action Security

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/tests/**'

permissions:
  contents: read

jobs:
  action-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify immutable action refs and minimum token permissions
        run: python -m unittest discover -s .github/tests -p 'test_workflow_action_pinning.py' -v
