name: Database rebuild qualification

on:
  push:
    branches:
      - 'main'
    paths:
      - 'database/**'
      - 'archive/supabase-project-lantern/**'
      - 'tools/qualification/**'
      - '.github/workflows/database-rebuild-qualification.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'archive/supabase-project-lantern/**'
      - 'tools/qualification/**'
      - '.github/workflows/database-rebuild-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bt2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bt2_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bt2_ci
    steps:
      - uses: actions/checkout@v4

      - name: Verify PostgreSQL client and bind service image
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'select version();'
          image_id="$(docker inspect '${{ job.services.postgres.id }}' --format '{{.Image}}')"
          digest="$(docker image inspect "$image_id" --format '{{index .RepoDigests 0}}')"
          test -n "$digest"
          test "$digest" != '<no value>'
          echo "POSTGRES_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Resolved PostgreSQL service image: $digest"

      - name: Canonical PostgreSQL 16 blank rebuild
        run: |
          python tools/qualification/run_postgres16_blank_rebuild.py \
            --database-url "$DATABASE_URL" \
            --postgres-image-digest "$POSTGRES_IMAGE_DIGEST" \
            --evidence-out /tmp/bt2_blank_rebuild_evidence.json

      - name: True multi-session Lantern concurrency
        run: |
          python tools/qualification/run_lantern_multisession_concurrency_v2.py \
            --database-url "$DATABASE_URL" \
            --postgres-image-digest "$POSTGRES_IMAGE_DIGEST" \
            --evidence-out /tmp/bt2_lantern_concurrency_evidence.json

      - name: Evidence summary
        if: always()
        run: |
          test ! -f /tmp/bt2_blank_rebuild_evidence.json || cat /tmp/bt2_blank_rebuild_evidence.json
          test ! -f /tmp/bt2_lantern_concurrency_evidence.json || cat /tmp/bt2_lantern_concurrency_evidence.json
