name: Database rebuild qualification

on:
  push:
    branches:
      - main
    paths:
      - 'database/**'
      - 'archive/supabase-project-lantern/**'
      - 'tools/qualification/**'
      - 'tests/**'
      - 'native/project/**'
      - 'docs/runtime/LANTERN_POSTGRESQL_*.md'
      - '.github/workflows/database-rebuild-qualification.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'archive/supabase-project-lantern/**'
      - 'tools/qualification/**'
      - 'tests/**'
      - 'native/project/**'
      - 'docs/runtime/LANTERN_POSTGRESQL_*.md'
      - '.github/workflows/database-rebuild-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bt2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bt2_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bt2_ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind PostgreSQL service container
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'select version();'
          docker inspect '${{ job.services.postgres.id }}' --format '{{.Id}} {{.Image}} {{.Config.Image}} {{.State.Running}}'
          echo "POSTGRES_CONTAINER_ID=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
      - name: Verify V4 source package
        run: python tools/qualification/test_lantern_postgresql_v4_source_binding.py
      - name: Run PostgreSQL qualification policy tests
        run: python -m unittest discover -s tests -p 'test_postgres*.py' -v
      - name: Canonical PostgreSQL 16 blank rebuild
        run: |
          python tools/qualification/run_postgres16_blank_rebuild.py \
            --database-url "$DATABASE_URL" \
            --postgres-container-id "$POSTGRES_CONTAINER_ID" \
            --evidence-out /tmp/bt2_blank_rebuild_evidence.json
      - name: PostgreSQL 16 Lantern concurrency
        run: |
          python tools/qualification/run_lantern_multisession_concurrency_v2.py \
            --database-url "$DATABASE_URL" \
            --postgres-container-id "$POSTGRES_CONTAINER_ID" \
            --evidence-out /tmp/bt2_lantern_concurrency_evidence.json
      - name: Evidence summary
        if: always()
        run: |
          test ! -f /tmp/bt2_blank_rebuild_evidence.json || cat /tmp/bt2_blank_rebuild_evidence.json
          test ! -f /tmp/bt2_lantern_concurrency_evidence.json || cat /tmp/bt2_lantern_concurrency_evidence.json

  postgres17-managed-owner:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bt2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bt2_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://bt2admin:bt2admin@localhost:5432/bt2_ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind PostgreSQL service container
        run: |
          docker inspect '${{ job.services.postgres.id }}' --format '{{.Id}} {{.Image}} {{.Config.Image}} {{.State.Running}}'
          echo "POSTGRES_CONTAINER_ID=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
      - name: Prepare managed-service-style owner
        run: |
          PGPASSWORD=postgres psql postgresql://postgres:postgres@localhost:5432/bt2_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bt2admin LOGIN PASSWORD 'bt2admin' CREATEDB CREATEROLE NOSUPERUSER;
          ALTER DATABASE bt2_ci OWNER TO bt2admin;
          SQL
      - name: Verify managed owner
        run: |
          PGPASSWORD=bt2admin psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc \
            "SELECT current_user,rolsuper,rolcreaterole,rolcreatedb FROM pg_roles WHERE rolname=current_user;"
      - name: Verify V4 source package
        run: python tools/qualification/test_lantern_postgresql_v4_source_binding.py
      - name: Run PostgreSQL qualification policy tests
        run: python -m unittest discover -s tests -p 'test_postgres*.py' -v
      - name: PostgreSQL 17 canonical rebuild compatibility
        run: |
          PGPASSWORD=bt2admin python tools/qualification/run_postgres17_blank_rebuild_compatibility.py \
            --database-url "$DATABASE_URL" \
            --postgres-container-id "$POSTGRES_CONTAINER_ID" \
            --evidence-out /tmp/bt2_pg17_rebuild_evidence.json
      - name: PostgreSQL 17 Lantern concurrency
        run: |
          PGPASSWORD=bt2admin python tools/qualification/run_lantern_multisession_concurrency_v2.py \
            --database-url "$DATABASE_URL" \
            --postgres-container-id "$POSTGRES_CONTAINER_ID" \
            --evidence-out /tmp/bt2_pg17_lantern_concurrency_evidence.json
      - name: Evidence summary
        if: always()
        run: |
          test ! -f /tmp/bt2_pg17_rebuild_evidence.json || cat /tmp/bt2_pg17_rebuild_evidence.json
          test ! -f /tmp/bt2_pg17_lantern_concurrency_evidence.json || cat /tmp/bt2_pg17_lantern_concurrency_evidence.json
