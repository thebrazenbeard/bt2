name: AI Psychology Source Conformance

on:
  pull_request:
    paths:
      - 'conformance/ai_psychology/**'
      - '.github/workflows/ai-psychology-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'conformance/ai_psychology/**'
      - '.github/workflows/ai-psychology-conformance.yml'

permissions:
  contents: read

jobs:
  inert-contract:
    name: inert-source-only-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run source-only negative conformance tests (not runtime qualification)
        run: python -m unittest discover -s conformance/ai_psychology -p 'test_*.py' -v
