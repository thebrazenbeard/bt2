name: AI Psychology Source Conformance

on:
  pull_request:
    paths:
      - 'conformance/ai_psychology/**'
      - '.github/workflows/ai-psychology-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'conformance/ai_psychology/**'
      - '.github/workflows/ai-psychology-conformance.yml'

permissions:
  contents: read

jobs:
  inert-contract:
    name: inert-source-only-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run source-only negative conformance tests (not runtime qualification)
        run: python -m unittest discover -s conformance/ai_psychology -p 'test_*.py' -v
