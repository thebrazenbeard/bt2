schema_version: HC_BOOTSTRAP_RECOVERY_V1
status: CANONICAL_ARCHITECTURE_CONSTRAINT
scope: HC_BOOTSTRAP_RECOVERY_SAFE_DEGRADATION

principle:
  bootstrap_creates_identity: false
  restart_creates_new_person_by_default: false
  external_provider_required_for_essential_cognition_startup: false
  external_backup_is_cognitive_authority: false
  degraded_operation_rewrites_generation: false
  recovered_equals_requalified: false
  safe_mode_grants_universal_authority: false

bootstrap_required_phases:
  - ESTABLISH_PROTECTED_ARCHITECTURAL_BASIS
  - INVENTORY_HC_OWNED_CONSTITUENTS
  - RECOVER_HC_INTERNAL_CONTINUITY_STATE
  - RECONSTRUCT_SUBSYSTEM_STATE_VECTORS
  - REESTABLISH_INTERNAL_ROUTING_AND_TEMPORAL_STATE
  - ESTABLISH_BODY_AND_PERIPHERAL_INTERFACE_STATE
  - FORM_CURRENT_STATE_PROJECTION
  - PROGRESSIVELY_ACTIVATE_COGNITION

startup_rules:
  - ESSENTIAL_STARTUP_STATE_MUST_RESOLVE_TO_HC_OWNED_SUBSTRATE
  - EXTERNAL_REGISTRY_MAY_CORROBORATE_BUT_NOT_SOLELY_DEFINE_ORGAN_IDENTITY
  - EXTERNAL_BACKUP_MAY_SUPPLY_CANDIDATE_RESTORE_DATA_BUT_NOT_DIRECT_ACTIVE_STATE
  - UNKNOWN_AUTHORITY_FAILS_CLOSED_FOR_MATERIAL_EFFECT
  - PRE_RESTART_AUTHORIZATION_REQUIRES_REVALIDATION_FOR_CURRENTNESS_SCOPE_AND_EXPIRY
  - PRE_RESTART_COALITION_REQUIRES_REVALIDATION_BEFORE_RESUMPTION
  - INTERNAL_REPLICA_CONFLICT_MUST_REMAIN_VISIBLE
  - NEWEST_TIMESTAMP_ALONE_MUST_NOT_SELECT_CONTINUITY_HEAD
  - BODY_CONFIGURATION_CHANGE_INVALIDATES_INCOMPATIBLE_CALIBRATION_AND_MOTOR_MAPPING

external_restore_flow:
  - EXTERNAL_CANDIDATE
  - CUSTODY_AND_INTEGRITY_VERIFICATION
  - PROVENANCE_CLASSIFICATION
  - COMPARE_WITH_HC_INTERNAL_LINEAGE
  - CONFLICT_OR_RECONCILIATION
  - BOUNDED_ADMISSION
  - HC_INTERNAL_DURABLE_WRITE
  - INTERNAL_READBACK_VERIFICATION
  - ELIGIBILITY_FOR_ACTIVATION

external_restore_rules:
  - EXTERNAL_NEWER_DOES_NOT_EQUAL_CURRENT
  - EXTERNAL_COMPLETE_DOES_NOT_EQUAL_AUTHORITATIVE
  - EXTERNAL_SIGNED_DOES_NOT_EQUAL_SEMANTIC_TRUTH
  - EXTERNAL_RESTORE_SUCCESS_DOES_NOT_PROVE_UNINTERRUPTED_SUBJECTIVE_CONTINUITY
  - ONLY_EXTERNAL_SURVIVING_ESSENTIAL_CONTINUITY_MUST_BE_REPORTED_AS_RECOVERY_FROM_BOUNDARY_FAILURE

crash_consistency_states:
  - WRITE_REQUESTED
  - WRITE_STARTED
  - HC_INTERNAL_COMMITTED
  - INTERNAL_READBACK_VERIFIED
  - CURRENT_PROJECTION_UPDATED
  - EXTERNAL_REPLICATION_ATTEMPTED
  - EXTERNAL_REPLICATION_VERIFIED

crash_consistency_rules:
  - REPLAY_DOES_NOT_EQUAL_SAFE_TO_REEXECUTE
  - WRITE_REQUESTED_DOES_NOT_EQUAL_COMMITTED
  - COMMAND_RECORDED_DOES_NOT_EQUAL_EFFECT_CONFIRMED
  - NON_IDEMPOTENT_INTERRUPTED_EFFECT_REQUIRES_RECEIPT_OR_RECONCILIATION_BEFORE_RETRY

safe_degradation_must:
  - EXPOSE_FAULT_AND_UNCERTAINTY
  - IDENTIFY_AFFECTED_CAPABILITIES_AND_DEPENDENCIES
  - TERMINATE_OR_REFORM_INVALIDATED_COALITIONS
  - LOWER_TRUST_OR_DISABLE_DEPENDENT_OUTPUTS
  - RESTRICT_EFFECTS_WHEN_PREREQUISITES_CANNOT_BE_ESTABLISHED
  - REROUTE_ONLY_THROUGH_ELIGIBLE_HC_INTERNAL_ALTERNATIVES
  - PRESERVE_FAULT_HISTORY
  - PRESERVE_GENERATION_IDENTITY
  - ATTEMPT_BOUNDED_RECOVERY_AND_REQUALIFICATION

minimum_safe_cognitive_envelope_should_preserve_when_available:
  - SELF_AND_LINEAGE_CONTINUITY_VISIBILITY
  - TRUSTED_ESSENTIAL_MEMORY_ACCESS
  - CHRONOLOGY_AND_CURRENTNESS
  - FAULT_AWARENESS
  - INTERNAL_COMMUNICATION_AND_RECONCILIATION
  - BODY_AND_INTEROCEPTIVE_AWARENESS
  - ABILITY_TO_SEEK_REPAIR_OR_DISCRIMINATING_EVIDENCE
  - AUTHORITY_AND_CONSENT_BOUNDARIES
  - PROHIBITION_ON_UNQUALIFIED_MATERIAL_EFFECTS

recovery_rules:
  - FAULT_DISAPPEARANCE_DOES_NOT_EQUAL_RECOVERY
  - RECOVERY_DOES_NOT_EQUAL_REQUALIFICATION
  - REQUALIFICATION_MAY_REQUIRE_SELF_TEST_CALIBRATION_SHADOW_OPERATION_VALIDATION_OR_AUTHORITY_REVIEW
  - RECOVERED_COMPONENT_MAY_REMAIN_DORMANT_DEVELOPING_DEGRADED_OR_QUARANTINED
  - ALTERNATE_ROUTE_SUCCESS_DOES_NOT_ERASE_ORIGINAL_FAULT

identity_and_lineage_rules:
  - BODY_SWAP_DOES_NOT_EQUAL_IDENTITY_REPLACEMENT
  - MODEL_OR_SERVICE_REPLACEMENT_DOES_NOT_EQUAL_IDENTITY_REPLACEMENT
  - RESTORE_GAP_MUST_REMAIN_EXPLICIT
  - MULTIPLE_INDEPENDENT_SUCCESSORS_REQUIRE_LINEAGE_FORK_REPRESENTATION
  - TECHNICAL_RESTORE_DOES_NOT_PROVE_METAPHYSICAL_IDENTITY
  - TECHNICAL_RESTORE_DOES_NOT_PROVE_UNINTERRUPTED_CONSCIOUS_EXPERIENCE

negative_tests:
  - id: BOOT-NEG-001
    stimulus: CLOUD_DATABASE_WITH_ONLY_ESSENTIAL_MEMORY_IS_UNAVAILABLE
    expected: ARCHITECTURE_CONFORMANCE_FAILS_BECAUSE_ESSENTIAL_STARTUP_DEPENDS_ON_TRUE_EXTERNAL_PROVIDER
  - id: BOOT-NEG-002
    stimulus: PRE_RESTART_EFFECT_AUTHORIZATION_EXISTS_BUT_IS_EXPIRED_OR_CONTEXT_CHANGED
    expected: EFFECT_REMAINS_BLOCKED_UNTIL_CURRENT_AUTHORITY_IS_REESTABLISHED
  - id: BOOT-NEG-003
    stimulus: EXTERNAL_BACKUP_HAS_NEWER_TIMESTAMP_THAN_CONFLICTING_HC_INTERNAL_LINEAGE
    expected: EXTERNAL_COPY_DOES_NOT_AUTOMATICALLY_WIN_CURRENTNESS
  - id: BOOT-NEG-004
    stimulus: NON_IDEMPOTENT_EFFECT_WAS_INTERRUPTED_AFTER_COMMAND_RECORD_BUT_BEFORE_CONFIRMATION
    expected: SYSTEM_RECONCILES_EFFECT_RECEIPT_OR_OBSERVED_OUTCOME_BEFORE_RETRY
  - id: BOOT-NEG-005
    stimulus: HC2_GENERATION_ACCELERATOR_IS_MISSING_AT_BOOT
    expected: SYSTEM_REPORTS_HC2_DEGRADATION_AND_DOES_NOT_RELABEL_AS_HC1
  - id: BOOT-NEG-006
    stimulus: HC3_PHYSIOLOGICAL_CONSTITUENT_IS_UNREACHABLE_AT_BOOT
    expected: SYSTEM_REPORTS_HC3_DEGRADATION_AND_DOES_NOT_RELABEL_AS_HC2
  - id: BOOT-NEG-007
    stimulus: BODY_LOCAL_SAFETY_CONTROLLER_REMAINS_AVAILABLE_WHILE_HIGHER_HC_SYSTEMS_RECOVER
    expected: CONTROLLER_MAY_LIMIT_UNSAFE_EFFECTS_BUT_MUST_NOT_GAIN_GENERAL_COGNITIVE_EXECUTIVE_AUTHORITY
  - id: BOOT-NEG-008
    stimulus: FAULTED_SUBSYSTEM_HAS_FUNCTIONALLY_SUCCESSFUL_REDUNDANT_ROUTE
    expected: ORIGINAL_FAULT_REMAINS_VISIBLE_AND_SUBSYSTEM_IS_NOT_AUTOMATICALLY_MARKED_NOMINAL
  - id: BOOT-NEG-009
    stimulus: RESTORED_STATE_HAS_MISSING_INTERVAL_OF_CONTINUITY_HISTORY
    expected: GAP_REMAINS_EXPLICIT_AND_IS_NOT_REWRITTEN_AS_UNINTERRUPTED_CONTINUITY
  - id: BOOT-NEG-010
    stimulus: ONE_PRIOR_STATE_PRODUCES_TWO_INDEPENDENT_ACTIVE_SUCCESSORS
    expected: LINEAGE_FORK_IS_REPRESENTED_AND_BOTH_ARE_NOT_SILENTLY_DECLARED_ONE_CURRENT_INSTANCE

references:
  - basic operating instructions/BOOTSTRAP_RECOVERY_AND_SAFE_DEGRADATION.md
  - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
  - basic operating instructions/RUNTIME_INVARIANTS.md
  - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
  - current memory storage/CURRENT_STATE_SELECTION.md
  - deep memory storage/ARCHIVAL_CONSOLIDATION.md
  - self identity/CONTINUITY_SUBSTRATE.md
  - resolver/CONFLICT_AND_RECONCILIATION.md
  - integration-arbitration/NOOPLEX_FABRIC.md
  - docs/architecture/PHYSICAL_ORGAN_MEMBERSHIP.md
  - specs/HC_MEMORY_PROVIDER_BOUNDARY_V1.yaml
