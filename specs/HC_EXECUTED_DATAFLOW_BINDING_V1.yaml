schema_version: HC_EXECUTED_DATAFLOW_BINDING_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

requirements:
  - id: DF-001
    requirement: CONSEQUENTIALLY_DECLARED_INPUTS_ARE_VERIFIED_AT_THE_ACTUAL_CONSUMPTION_OR_MUTATION_BOUNDARY
    assertions:
      - DECLARED_INPUT_NE_EXECUTED_INPUT_WITHOUT_PATH_VERIFICATION
      - TARGET_ARGUMENT_PRESENT_NE_TARGET_DATA_EXECUTED
      - TARGET_PARAMETER_NE_VERIFIED_TARGET_BINDING
      - METHOD_SIGNATURE_NE_DATAFLOW_PROOF
      - SUCCESSFUL_EXECUTION_NE_CORRECT_DATAFLOW
      - OUTPUT_SCORE_NE_CORRECT_INPUT_BINDING

  - id: DF-002
    requirement: REFERENTIAL_LINEAGE_AND_EXECUTION_LINEAGE_BOTH_SUPPORT_MATERIAL_BINDINGS
    assertions:
      - CORRECT_VARIABLE_NAME_NE_CORRECT_REFERENT
      - CORRECT_REFERENT_METADATA_NE_PROOF_OBJECT_WAS_CONSUMED
      - SAME_SHAPE_NE_SAME_SEMANTIC_ROLE
      - TYPE_COMPATIBLE_NE_REFERENTIALLY_CORRECT
      - UNRESOLVED_REFERENTIAL_OR_EXECUTION_LINEAGE_IS_UNKNOWN

  - id: DF-003
    requirement: TRAINING_CALIBRATION_AND_EVALUATION_TARGETS_ARE_BOUND_TO_THE_ACTUALLY_CONSUMED_TARGET_OBJECT
    assertions:
      - NOMINALLY_SUPERVISED_NE_VERIFIED_TARGET_BINDING
      - EXPECTED_TARGET_SOURCE_NE_ACTUAL_TARGET_SOURCE_WITHOUT_TRACE
      - EVALUATION_TARGET_PROVIDED_NE_EVALUATION_TARGET_USED
      - SOURCE_DERIVED_SURROGATE_NE_GROUND_TRUTH_TARGET
      - WRONG_TARGET_BINDING_INVALIDATES_TARGET_DEPENDENT_METRIC_OR_QUALIFICATION_CLAIM

  - id: DF-004
    requirement: CONFIGURATION_OR_POLICY_SELECTION_IS_TRACED_TO_THE_MATERIAL_EFFECT_PATH
    assertions:
      - CONFIGURED_STRATEGY_NE_EXECUTED_STRATEGY_WITHOUT_PATH_VERIFICATION
      - SELECTED_POLICY_OBJECT_NE_EFFECT_PATH_USES_SELECTED_POLICY
      - FEATURE_FLAG_SET_NE_GUARANTEED_BEHAVIOR_CHANGE
      - DEFAULT_OR_HARD_CODED_PATH_CANNOT_SILENTLY_BYPASS_SELECTED_STRATEGY

  - id: DF-005
    requirement: AUTHORITY_AND_EFFECT_TARGET_BINDINGS_ARE_BOTH_VERIFIED
    assertions:
      - AUTHORITY_RECORD_AVAILABLE_NE_AUTHORITY_RECORD_CHECKED
      - AUTHORIZED_REQUEST_NE_CORRECTLY_BOUND_EFFECT
      - CORRECT_EFFECT_TARGET_NE_AUTHORIZED_EFFECT
      - STALE_OR_WRONG_ACTOR_AUTHORITY_RECORD_CANNOT_AUTHORIZE_EFFECT
      - EFFECT_TARGET_IDENTITY_IS_NOT_DERIVED_FROM_UNVERIFIED_LOCAL_POSITION

  - id: DF-006
    requirement: MEMORY_CURRENTNESS_AND_EXECUTED_RECORD_BINDING_REMAIN_JOINTLY_TRACEABLE
    assertions:
      - CURRENT_MEMORY_RECORD_LOADED_NE_CURRENT_MEMORY_RECORD_CONSUMED
      - RETRIEVED_CORRECT_RECORD_NE_EXECUTED_CURRENT_STATE_BINDING
      - SUPERSEDED_RECORD_CANNOT_SILENTLY_REPLACE_CURRENT_RECORD_BY_POSITION_OR_RANK
      - MEMORY_BINDING_PRESERVES_RECORD_ID_CURRENTNESS_AND_PROVENANCE

  - id: DF-007
    requirement: DECLARED_AGGREGATION_OR_TRANSFER_SEMANTICS_MATCH_MEASURED_EFFECTIVE_INFLUENCE
    assertions:
      - DECLARED_WEIGHT_NE_EFFECTIVE_INFLUENCE_WITHOUT_EXECUTION_TRACE
      - NAMED_EQUAL_WEIGHT_AGGREGATION_NE_VERIFIED_EFFECTIVE_WEIGHT_SEMANTICS
      - REPEATED_SCALING_AVERAGING_NORMALIZATION_OR_CLIPPING_IS_INCLUDED_IN_EFFECTIVE_INFLUENCE
      - BASIS_OR_EQUIVALENT_DISCRIMINATING_PROBE_CAN_VERIFY_EFFECTIVE_CONTRIBUTOR_COEFFICIENTS_WHEN_MATERIAL

  - id: DF-008
    requirement: PATH_VERIFICATION_USES_DISCRIMINATING_EVIDENCE
    assertions:
      - NONDISCRIMINATING_SENTINEL_NE_PATH_PROOF
      - PLAUSIBLE_OUTPUT_NE_PATH_PROOF
      - PATH_TEST_DISTINGUISHES_INTENDED_BINDING_FROM_PLAUSIBLE_WRONG_BINDINGS
      - BRANCH_OR_STRATEGY_COVERAGE_REACHES_MATERIAL_STATE_OR_EFFECT_BOUNDARY
      - PROVENANCE_OR_EXECUTION_RECEIPT_IDENTIFIES_ACTUALLY_CONSUMED_OBJECT_WHEN_REQUIRED

negative_tests:
  - PASS_DISTINCT_SOURCE_AND_TARGET_SENTINELS_THEN_WIRE_SOURCE_TO_TARGET_TRANSFORM_AND_REQUIRE_FAILURE
  - SWAP_SAME_SHAPED_OBJECTS_WITH_DISTINCT_STABLE_IDS_AND_REQUIRE_REFERENTIAL_FAILURE
  - SELECT_STRATEGY_A_THEN_HARD_CODE_STRATEGY_B_DOWNSTREAM_AND_REQUIRE_PATH_FAILURE
  - PROVIDE_VALID_AND_STALE_AUTHORITY_RECORDS_THEN_CONSUME_STALE_RECORD_AND_REQUIRE_EFFECT_REJECTION
  - REORDER_ACTUATOR_CHANNELS_WITH_STABLE_IDS_AND_REQUIRE_STALE_POSITIONAL_BINDING_REJECTION
  - RETRIEVE_CURRENT_AND_SUPERSEDED_MEMORY_RECORDS_THEN_CONSUME_SUPERSEDED_RECORD_AND_REQUIRE_CURRENTNESS_FAILURE
  - MUTATE_STATE_FAMILY_DIFFERENT_FROM_PROTECTED_UPDATE_DESCRIPTOR_AND_REQUIRE_BINDING_FAILURE
  - CONFIGURE_KNOWN_CONTRIBUTOR_WEIGHTS_AND_USE_BASIS_VECTOR_STATES_TO_MEASURE_EFFECTIVE_INFLUENCE
  - USE_SOURCE_DERIVED_SURROGATE_AS_EVALUATION_TARGET_AND_REQUIRE_TARGET_DEPENDENT_QUALIFICATION_INVALIDATION
  - PRODUCE_PLAUSIBLE_OUTPUT_THROUGH_WRONG_BRANCH_AND_REQUIRE_PATH_EVIDENCE_BEFORE_CONFORMANCE

references:
  - docs/architecture/EXECUTED_DATAFLOW_AND_BINDING_INTEGRITY.md
  - docs/architecture/REFERENCE_IDENTITY_AND_INDEX_LINEAGE.md
  - docs/architecture/REPRESENTATION_FIDELITY_AND_OBJECTIVE_PROVENANCE.md
  - docs/architecture/DISTRIBUTED_LEARNING_AND_UPDATE_ANCESTRY.md
  - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
  - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
  - kinesis/ACTION_GATEWAY.md
  - current memory storage/CURRENT_STATE_SELECTION.md
  - docs/research/BASIRA_REPFL_REPLICA_ANCESTRY_AND_TARGET_DATAFLOW_2026-09-09.md
