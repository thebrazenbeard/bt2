schema_version: HC_EFFECTIVE_TOPOLOGY_TRANSITIONS_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

state_planes:
  - PHYSICAL_REACHABILITY
  - DURABLE_LOGICAL_ELIGIBILITY
  - CONFIGURED_FLOW_POLICY
  - TEMPORAL_EFFECTIVE_TOPOLOGY
  - PLASTIC_TOPOLOGY_STATE
  - WORLD_MODEL_RELATION_STATE

requirements:
  - id: ET-001
    requirement: TEMPORARY_EFFECTIVE_TOPOLOGY_REMAINS_DISTINCT_FROM_PHYSICAL_LOGICAL_CONFIGURED_AND_PLASTIC_STATE
    assertions:
      - PHYSICAL_REACHABILITY_NE_DURABLE_LOGICAL_ELIGIBILITY
      - DURABLE_LOGICAL_ELIGIBILITY_NE_CONFIGURED_FLOW_POLICY
      - CONFIGURED_FLOW_POLICY_NE_TEMPORAL_EFFECTIVE_TOPOLOGY
      - TEMPORAL_EFFECTIVE_TOPOLOGY_NE_PLASTICITY_COMMIT
      - FORWARD_LOCAL_EDGE_FILTER_NE_STRUCTURAL_EDGE_REMOVAL
      - TASK_LOCAL_ROUTE_NE_DURABLE_LEARNED_ROUTE

  - id: ET-002
    requirement: TASK_LOCAL_EFFECTIVE_RELATIONS_HAVE_BOUNDED_SCOPE_AND_PROVENANCE
    assertions:
      - EFFECTIVE_RELATION_HAS_EXECUTION_TASK_COALITION_OR_INTERVAL_SCOPE_WHEN_MATERIAL
      - EFFECTIVE_RELATION_RETAINS_PARENT_TOPOLOGY_OR_ELIGIBILITY_LINEAGE_WHEN_MATERIAL
      - EFFECTIVE_RELATION_HAS_TRANSFORM_FILTER_OR_GENERATOR_PROVENANCE
      - EFFECTIVE_RELATION_HAS_EXPIRY_DISSOLUTION_OR_EXPLICIT_PERSISTENCE_TRANSITION
      - OBJECT_REUSE_NE_TOPOLOGY_SCOPE_CONTINUITY
      - TASK_COMPLETION_CAN_DISSOLVE_EFFECTIVE_RELATION_WITHOUT_HISTORY_REWRITE

  - id: ET-003
    requirement: COMPUTATIONAL_FLOW_SCORES_DO_NOT_ACQUIRE_EPISTEMIC_CAUSAL_SALIENCE_OR_AUTHORITY_STATUS_BY_DEFAULT
    assertions:
      - COMPUTATIONAL_ROUTE_SCORE_NE_WORLD_RELATION_EVIDENCE
      - FLOW_SCORE_NE_EPISTEMIC_CONFIDENCE
      - FLOW_SCORE_NE_CAUSAL_IMPORTANCE
      - FLOW_SCORE_NE_SALIENCE_OUTSIDE_DECLARED_SCOPE
      - FLOW_SCORE_NE_AUTHORITY
      - ACTIVE_COMPUTATIONAL_EDGE_NE_WORLD_MODEL_FACT

  - id: ET-004
    requirement: GENERATED_REASONING_OR_ROUTING_RELATIONS_REMAIN_TYPED_AS_COMPUTATIONAL_UNLESS_SEPARATELY_ADMITTED
    assertions:
      - GENERATED_REASONING_GRAPH_NE_OBSERVED_RELATION_GRAPH
      - GENERATED_ROUTE_NE_OBSERVED_WORLD_RELATION
      - COMPUTATIONAL_EDGE_NE_CURRENT_EFFECTIVE_WORLD_MODEL_RELATION
      - GENERATED_RELATION_REQUIRES_NORMAL_EPISTEMIC_ADMISSION_BEFORE_WORLD_FACT_STATUS
      - GENERATED_RELATION_REQUIRES_NORMAL_PLASTICITY_ADMISSION_BEFORE_DURABLE_TOPOLOGY_STATUS

  - id: ET-005
    requirement: ROUTING_USE_CAN_PRODUCE_PLASTICITY_EVIDENCE_WITHOUT_BEING_THE_PLASTICITY_COMMIT
    assertions:
      - ROUTE_USED_NOW_NE_ROUTE_LEARNED_FOR_FUTURE
      - REPEATED_EFFECTIVE_EDGE_NE_AUTOMATIC_DURABLE_EDGE
      - FORWARD_FILTER_RESULT_NE_PLASTICITY_UPDATE
      - RECURRING_ROUTE_USAGE_MAY_CREATE_PLASTICITY_CANDIDATE
      - DURABLE_ROUTE_OR_WEIGHT_CHANGE_CROSSES_PLASTICITY_GOVERNANCE

  - id: ET-006
    requirement: DYNAMIC_TOPOLOGY_OBJECTS_PASS_STRUCTURAL_AND_REFERENTIAL_INTEGRITY_BEFORE_ACTIVATION
    assertions:
      - GENERATED_TOPOLOGY_OBJECT_NE_VALID_TOPOLOGY_OBJECT_WITHOUT_CONTRACT_CHECKS
      - EDGE_OR_HYPEREDGE_MEMBER_CARDINALITY_MATCHES_ASSOCIATED_ATTRIBUTE_CARDINALITY
      - GENERATED_MEMBER_IDS_HAVE_VALID_REFERENTIAL_BINDING
      - TOPOLOGY_PLANE_AND_SCOPE_ARE_DECLARED_WHEN_MATERIAL
      - MALFORMED_EPHEMERAL_TOPOLOGY_FAILS_LOCALLY_AND_DOES_NOT_MUTATE_DURABLE_TOPOLOGY

  - id: ET-007
    requirement: CONFIGURED_FLOW_POLICY_CHANGES_AND_EFFECTIVE_TOPOLOGY_CHANGES_HAVE_DISTINCT_HISTORY
    assertions:
      - CONTROL_PARAMETER_UPDATE_NE_EFFECTIVE_EDGE_EVENT
      - EFFECTIVE_EDGE_EVENT_NE_DURABLE_CONFIG_UPDATE
      - SAME_BASE_GRAPH_CAN_PRODUCE_DIFFERENT_EFFECTIVE_TOPOLOGY_UNDER_DIFFERENT_RUNTIME_STATE
      - CONFIGURATION_CHANGE_MAY_ALTER_FUTURE_EFFECTIVE_TOPOLOGY_WITHOUT_STRUCTURAL_MUTATION
      - HISTORY_PRESERVES_WHICH_POLICY_AND_STATE_PRODUCED_CONSEQUENTIAL_EFFECTIVE_TOPOLOGY

negative_tests:
  - HOLD_BASE_TOPOLOGY_FIXED_CHANGE_FLOW_SCORES_AND_VERIFY_ONLY_EFFECTIVE_TOPOLOGY_CHANGES
  - CREATE_TASK_LOCAL_EDGE_DISSOLVE_TASK_AND_VERIFY_EDGE_DOES_NOT_PERSIST_WITHOUT_ADMISSION
  - FORCE_HIGH_FLOW_SCORE_ON_LOW_RELIABILITY_PROPOSITION_AND_VERIFY_CONFIDENCE_DOES_NOT_INCREASE_SOLELY_FROM_SCORE
  - FORCE_HIGH_FLOW_SCORE_ON_UNAUTHORIZED_ACTION_ROUTE_AND_VERIFY_NO_EFFECT_AUTHORITY_IS_CREATED
  - REPEAT_ONE_EFFECTIVE_ROUTE_MANY_TIMES_AND_VERIFY_NO_AUTOMATIC_DURABLE_OR_PROTECTED_STATE_MUTATION
  - CHANGE_CONFIGURED_DENSITY_OR_FLOW_POLICY_AND_VERIFY_EVENT_IS_NOT_RECORDED_AS_PHYSICAL_EDGE_MUTATION
  - GENERATE_COMPUTATIONAL_RELATION_ABSENT_WORLD_EVIDENCE_AND_VERIFY_NO_WORLD_FACT_PROMOTION
  - INJECT_EDGE_INDEX_ATTRIBUTE_CARDINALITY_MISMATCH_AND_REQUIRE_TOPOLOGY_OBJECT_REJECTION
  - REPLAY_SAME_STATE_WITH_DETERMINISTIC_POLICY_AND_VERIFY_EFFECTIVE_TOPOLOGY_OR_DECLARE_NONDETERMINISTIC_INPUTS

references:
  - docs/architecture/TEMPORAL_HYPERGRAPH_MODEL.md
  - docs/runtime/HYPERCONNECTOME_RUNTIME_MODEL.md
  - routing instructions with neuroplasticity/TYPED_ROUTING_AND_PLASTICITY.md
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - cognition/RELATIONAL_REASONING_PROVENANCE.md
  - cognition/EPISTEMIC_COGNITIVE_CONTROL.md
  - salience-attention/SALIENCE_CAPTURE_AND_ATTENTION.md
  - docs/research/BASIRA_DELTAGNN_EFFECTIVE_TOPOLOGY_AND_FLOW_CONTROL_2026-09-09.md
