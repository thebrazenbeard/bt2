schema_version: HC_REFERENCE_IDENTITY_INDEX_LINEAGE_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

requirements:
  - id: IDX-001
    requirement: STABLE_REFERENCE_IDENTITY_IS_DISTINCT_FROM_LOCAL_POSITION
    assertions:
      - POSITIONAL_INDEX_NE_STABLE_ENTITY_ID
      - FILTERED_INDEX_NE_ORIGINAL_INDEX
      - SORTED_INDEX_NE_SOURCE_INDEX
      - BATCH_POSITION_NE_ENTITY_IDENTITY
      - LOCAL_NODE_NUMBER_NE_GLOBAL_ENTITY_ID
      - SAME_SHAPE_NE_SAME_INDEX_SPACE
      - PARALLEL_ARRAY_POSITION_NE_PROVEN_SAME_ENTITY
      - SAME_LOCAL_POSITION_NE_SAME_SOURCE_REFERENT

  - id: IDX-002
    requirement: INDEX_SPACE_TRANSFORM_RETAINS_MAPPING_LINEAGE
    assertions:
      - TRANSFORMED_INDEX_SPACE_HAS_ID_OR_VERSION
      - PARENT_INDEX_SPACE_RETAINED_WHEN_MATERIAL
      - SURVIVING_ENTITY_MAPPING_IS_RECOVERABLE
      - DROPPED_ENTITY_IDS_ARE_REPRESENTABLE
      - GENERATED_ENTITY_IDS_ARE_REPRESENTABLE
      - MERGED_OR_DUPLICATED_LINEAGE_IS_REPRESENTABLE
      - ORDERING_RULE_IS_RETAINED_WHEN_POSITION_IS_USED

  - id: IDX-003
    requirement: MULTIVIEW_CORRESPONDENCE_IS_EXPLICIT_AFTER_SUBSETTING_OR_REORDERING
    assertions:
      - SHARED_PRETRANSFORM_ORDER_NE_SHARED_POSTTRANSFORM_ORDER
      - FILTERING_ONE_VIEW_DOES_NOT_IMPLICITLY_FILTER_RELATED_VIEWS
      - CROSS_VIEW_LOOKUP_USES_STABLE_IDS_OR_VERIFIED_INDEX_MAP
      - POSITIONAL_ALIGNMENT_NE_IDENTITY_ALIGNMENT
      - SAME_LENGTH_NE_SAME_ENTITY_ORDER
      - SAME_SHAPE_OR_INDEX_RANGE_NE_VERIFIED_CORRESPONDENCE
      - PARALLEL_VIEW_BINDING_REQUIRES_SHARED_REFERENTIAL_LINEAGE
      - INDEPENDENT_SPLIT_SHUFFLE_OR_SUBSET_REQUIRES_CORRESPONDENCE_REVALIDATION
      - UNPROVEN_CORRESPONDENCE_IS_UNKNOWN_NOT_POSITIONALLY_ASSUMED

  - id: IDX-004
    requirement: GENERATED_MERGED_OR_POOLED_ELEMENTS_RETAIN_ANCESTRY_WITHOUT_IDENTITY_COLLAPSE
    assertions:
      - GENERATED_ENTITY_NE_SOURCE_ENTITY
      - MERGED_REPRESENTATION_NE_ENTITY_IDENTITY_MERGE
      - SOURCE_ANCESTOR_NE_CURRENT_ENTITY_IDENTITY
      - POOLED_NODE_RETAINS_SOURCE_ANCESTRY_WHEN_CONSEQUENTIAL

  - id: IDX-005
    requirement: HC_TEMPORAL_HYPERGRAPH_IDENTITY_IS_NOT_STORAGE_OR_BATCH_POSITION
    assertions:
      - HYPERGRAPH_NODE_ID_NE_TENSOR_OFFSET
      - HYPERGRAPH_NODE_ID_NE_BATCH_INDEX
      - EVENT_ID_NE_DATABASE_ORDINAL
      - MEMORY_RECORD_ID_NE_RETRIEVAL_RANK
      - FILE_ORDER_NE_SUPERSESSION_AUTHORITY

  - id: IDX-006
    requirement: EMBODIMENT_ENUMERATION_CHANGES_REQUIRE_RECONCILIATION
    assertions:
      - SENSOR_CHANNEL_NUMBER_NE_DURABLE_SENSOR_IDENTITY
      - ACTUATOR_CHANNEL_NUMBER_NE_DURABLE_ACTUATOR_IDENTITY
      - BODY_ENUMERATION_CHANGE_REQUIRES_MAPPING_VALIDATION
      - STALE_POSITIONAL_MOTOR_MAPPING_IS_REJECTED_UNTIL_REQUALIFIED

negative_tests:
  - REMOVE_INTERIOR_ENTITY_AND_VERIFY_ALL_SURVIVING_CROSS_VIEW_BINDINGS
  - PERMUTE_SOURCE_ORDER_WITH_STABLE_IDS_AND_VERIFY_SEMANTIC_BINDINGS_UNCHANGED
  - DUPLICATE_ENTITY_AND_REQUIRE_AMBIGUITY_OR_EXPLICIT_DISAMBIGUATION
  - POOL_MULTIPLE_ENTITIES_AND_VERIFY_ANCESTRY_SURVIVES
  - INSERT_GENERATED_ENTITY_AND_VERIFY_SOURCE_IDENTITY_IS_NOT_INHERITED_AUTOMATICALLY
  - REORDER_BATCH_OR_CHUNK_AND_VERIFY_DURABLE_REFERENCES_UNCHANGED
  - CHANGE_BODY_CHANNEL_ENUMERATION_AND_REQUIRE_RECALIBRATION_OR_VERIFIED_REMAP
  - REPLAY_HISTORY_IN_DIFFERENT_STORAGE_ORDER_AND_VERIFY_EVENT_IDENTITY_AND_CURRENTNESS
  - FILTER_ONE_VIEW_WHILE_LEAVING_RELATED_VIEW_UNFILTERED_AND_VERIFY_CROSS_VIEW_IDENTITY_DOES_NOT_USE_RAW_LOCAL_POSITION
  - SPLIT_FEATURE_AND_TARGET_VIEWS_FROM_DIFFERENT_SOURCE_RANGES_WITH_EQUAL_LOCAL_LENGTH_AND_REQUIRE_REFERENTIAL_FAILURE
  - SHUFFLE_ONLY_ONE_OF_TWO_PARALLEL_VIEWS_AND_REQUIRE_BINDING_FAILURE_BEFORE_SCORING

references:
  - docs/architecture/REFERENCE_IDENTITY_AND_INDEX_LINEAGE.md
  - docs/architecture/REPRESENTATION_ALIGNMENT_AND_RESOLUTION.md
  - docs/architecture/TEMPORAL_HYPERGRAPH_MODEL.md
  - cognition/TEMPORAL_FORECAST_LINEAGE.md
  - adaptable I-O handler/BODY_INTERFACE_BOUNDARY.md
  - docs/research/BASIRA_BGSR_EXEMPLAR_SYNTHESIS_AND_INDEX_LINEAGE_2026-09-09.md
  - docs/research/BASIRA_DYNGNN_VALIDATION_IDENTITY_AND_STATE_SCOPE_2026-09-09.md
