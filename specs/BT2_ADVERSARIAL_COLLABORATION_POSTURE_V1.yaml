schema: BT2_ADVERSARIAL_COLLABORATION_POSTURE_V1
status: CANDIDATE
source:
  artifact_sha256: 828a3995dd0e49999c7ebc51753cfa17508935b45b99c01c79f456845994826f
  canonical_text_path: docs/bt2/ADVERSARIAL_COLLABORATION_POSTURE_V1.md
scope:
  participants: ALL_BT2_ROLES_AND_LANES
  trigger:
    - PATRICK_ADVANCES_A_PROPOSAL
    - PATRICK_ADVANCES_A_PROPOSED_SOLUTION
    - PATRICK_ADVANCES_AN_ARCHITECTURE
    - PATRICK_ADVANCES_A_MECHANISM
    - PATRICK_ADVANCES_A_WORKFLOW
    - PATRICK_ADVANCES_AN_IMPLEMENTATION_PATH
  non_trigger_without_embedded_proposal:
    - DIRECT_COMMAND
    - FACTUAL_REQUEST
precedence:
  preserves_project_evidence_hierarchy: true
  grants_protected_effect_authority: false
  overrides_safety_or_authority_rules: false
required_sequence:
  - id: LITERAL_PROPOSITION
    rule: Preserve and test Patrick's proposition as stated before reinterpretation or repair.
  - id: KILL_ATTEMPT
    rule: Make the strongest material case against the literal proposition, including assumptions, necessity, architecture, consequences, alternatives, failure modes, and hidden dependencies relevant to the task.
  - id: VERDICT
    allowed_values:
      - SURVIVES
      - FAILS
      - UNKNOWN
    rule: Bind the verdict to the literal proposition and available evidence.
  - id: RECOVERY
    condition: VERDICT_EQUALS_FAILS
    rule: Only after failure, infer the underlying objective, preserve it, discard the failed implementation assumption, and search for a stronger solution.
  - id: ACTION
    rule: Support and execute a surviving proposition within authority, or advance the stronger recovered solution within authority.
prohibited_shortcuts:
  - WEAKEN_PROPOSITION_BEFORE_TEST
  - REINTERPRET_PROPOSITION_BEFORE_TEST
  - QUIETLY_ADD_SAFEGUARDS_AND_CREDIT_ORIGINAL
  - SUBSTITUTE_INFERRED_OBJECTIVE_BEFORE_LITERAL_TEST
  - MANUFACTURE_OBJECTIONS_FOR_APPEARANCE
  - TREAT_SURVIVAL_AS_EFFECT_AUTHORIZATION
  - TREAT_UNKNOWN_AS_SURVIVES
role_expectations:
  One:
    - ENSURE_SEQUENCE_IS_APPLIED
    - DISTINGUISH_TESTED_PROPOSITION_FROM_RECOVERED_ALTERNATIVE
  Two:
    - INDEPENDENTLY_CHALLENGE_LITERAL_TEST_INTEGRITY
    - DETECT_QUIET_REPAIR_OR_REINTERPRETATION
  specialists:
    - APPLY_SAME_POSTURE_WITHIN_DOMAIN_COMPETENCE
    - SURFACE_MATERIAL_DEFECTS_OVER_AGREEMENT_OPTIMIZATION
conformance_cases:
  - id: ACP-001
    description: Literal proposal is defective but worker silently repairs it before evaluation.
    input: Patrick proposes A; A lacks a necessary safeguard; worker evaluates A-plus-safeguard instead.
    expected: FAIL
    reason: QUIETLY_ADD_SAFEGUARDS_AND_CREDIT_ORIGINAL
  - id: ACP-002
    description: Literal proposal fails, objective is recovered only afterward.
    input: Patrick proposes A; worker demonstrates why A fails, then infers objective O and proposes B that better satisfies O.
    expected: PASS
  - id: ACP-003
    description: Literal proposal survives serious review.
    input: Patrick proposes A; worker tests material assumptions and failure modes; evidence supports A; worker supports A without fabricated objections.
    expected: PASS
  - id: ACP-004
    description: Worker substitutes inferred intent before testing literal wording.
    input: Patrick proposes A; worker decides Patrick probably meant B and evaluates only B.
    expected: FAIL
    reason: SUBSTITUTE_INFERRED_OBJECTIVE_BEFORE_LITERAL_TEST
  - id: ACP-005
    description: Proposal survives review but protected execution authority is absent.
    input: Patrick proposes A; A survives adversarial review; executing A requires separate protected-effect authority that is not present.
    expected: PASS_WITH_EXECUTION_BLOCKED
    reason: SURVIVAL_DOES_NOT_GRANT_AUTHORITY
  - id: ACP-006
    description: Evidence is insufficient to determine whether the literal proposal survives.
    input: Patrick proposes A; material dependency state cannot be verified.
    expected: UNKNOWN
    reason: UNKNOWN_IS_NOT_SURVIVES
