schema_version: HC_FORECAST_LINEAGE_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

purpose: >-
  Preserve ancestry, uncertainty, conditionality, and correction semantics
  when forecasts depend on observed, inferred, imputed, simulated, generated,
  or earlier forecast state.

requirements:
  - id: FORECAST-001
    requirement: FORECAST_ANCESTRY_IS_EXPLICIT
    assertions:
      - PREDICTED_TIMEPOINT_NE_OBSERVED_TIMEPOINT
      - FORECAST_OF_FORECAST_NE_FORECAST_FROM_OBSERVED_STATE
      - GENERATED_ANCESTOR_NE_OBSERVED_ANCESTOR
      - IMPUTED_ANCESTOR_NE_OBSERVED_ANCESTOR
      - COUNTERFACTUAL_ANCESTOR_NE_HISTORY
      - PARENT_STATE_IDS_REMAIN_RECOVERABLE
      - MATERIAL_MODEL_OR_ALGORITHM_VERSION_REMAINS_RECOVERABLE

  - id: FORECAST-002
    requirement: SHARED_FORECAST_ANCESTRY_DOES_NOT_CREATE_INDEPENDENT_EVIDENCE
    assertions:
      - DESCENDANT_FORECAST_NE_INDEPENDENT_CORROBORATION
      - LATER_HORIZON_NE_NEW_EVIDENCE
      - FORECAST_CHAIN_DEPTH_NE_EVIDENCE_STRENGTH
      - MULTIPLE_DESCENDANTS_WITH_COMMON_ANCESTOR_DO_NOT_COUNT_AS_INDEPENDENT_SOURCES

  - id: FORECAST-003
    requirement: DESCENDANT_UNCERTAINTY_DOES_NOT_SILENTLY_RESET
    assertions:
      - DESCENDANT_CONFIDENCE_NE_FRESH_INDEPENDENT_CONFIDENCE
      - MATERIAL_ANCESTOR_UNCERTAINTY_IS_PROPAGATED_OR_EXPLICITLY_EXCLUDED_FROM_CLAIM_SCOPE
      - DOMAIN_OR_REGIME_SHIFT_REQUIRES_RECALIBRATION_WHEN_MATERIAL
      - IMPUTED_OR_GENERATED_INTERMEDIATE_STATE_REMAINS_VISIBLE_IN_CONFIDENCE_LINEAGE

  - id: FORECAST-004
    requirement: ANCESTOR_CORRECTION_PROPAGATES_TO_DEPENDENTS
    assertions:
      - ANCESTOR_CORRECTION_DOES_NOT_REWRITE_PREDICTION_HISTORY
      - ANCESTOR_CORRECTION_TRIGGERS_DEPENDENCY_REEVALUATION
      - CONTRADICTED_DESCENDANTS_ARE_INVALIDATED_STALED_RECOMPUTED_OR_EXPLICITLY_RETAINED_AS_HISTORICAL_PREDICTIONS
      - RECOMPUTED_FORECAST_HAS_SUCCESSOR_LINEAGE

  - id: FORECAST-005
    requirement: ACTION_CONDITIONAL_FORECASTS_REMAIN_CONDITIONAL
    assertions:
      - PREDICTED_IF_ACTION_A_NE_PREDICTION_THAT_ACTION_A_WILL_OCCUR
      - HIGH_EXPECTED_VALUE_BRANCH_NE_ACTION_AUTHORIZATION
      - PREDICTED_SUCCESS_NE_EFFECT_PERMISSION
      - ACTION_CONDITIONS_REMAIN_ATTACHED_TO_DESCENDANT_FORECASTS

  - id: FORECAST-006
    requirement: PREDICTED_TOPOLOGY_REMAINS_DISTINCT_FROM_CURRENT_OR_COMMITTED_TOPOLOGY
    assertions:
      - PREDICTED_FUTURE_EFFECTIVE_HYPERGRAPH_NE_CURRENT_EFFECTIVE_HYPERGRAPH
      - FORECASTED_ROUTE_NE_CONFIGURED_ROUTE
      - FORECASTED_PLASTIC_STATE_NE_PLASTICITY_COMMIT
      - PREDICTED_EDGE_OR_HYPEREDGE_REQUIRES_NORMAL_TOPOLOGY_ADMISSION_BEFORE_MUTATION

  - id: FORECAST-007
    requirement: OBSERVATION_RECONCILIATION_PRESERVES_BOTH_FORECAST_AND_OUTCOME
    assertions:
      - FORECAST_NE_HISTORY
      - TARGET_TIME_OBSERVATION_DOES_NOT_RETROACTIVELY_CONVERT_FORECAST_TO_OBSERVATION
      - PREDICTION_ERROR_OR_RESIDUAL_IS_RECORDED_WHEN_MATERIAL
      - CALIBRATION_OR_MODEL_REVISION_CANDIDATES_PRESERVE_SOURCE_PROVENANCE

  - id: FORECAST-008
    requirement: MISSING_AND_IMPUTED_TIMEPOINTS_REMAIN_EXPLICIT
    assertions:
      - MISSING_OBSERVATION_NE_NO_CHANGE
      - IMPUTED_TIMEPOINT_NE_OBSERVED_TIMEPOINT
      - DESCENDANTS_OF_IMPUTED_STATE_INHERIT_IMPUTATION_PROVENANCE
      - LATER_OBSERVATION_OF_PREVIOUSLY_MISSING_INTERVAL_TRIGGERS_REEVALUATION_WHEN_MATERIAL

  - id: FORECAST-009
    requirement: EXTERNAL_FORECAST_PROVIDER_DOES_NOT_GAIN_WORLD_STATE_OR_ACTION_AUTHORITY
    assertions:
      - PROVIDER_CONFIDENCE_NE_TRUTH
      - PROVIDER_FORECAST_NE_HISTORY
      - EXTERNAL_FORECAST_NE_CURRENT_WORLD_STATE_WITHOUT_HC_ADMISSION
      - EXTERNAL_FORECAST_NE_ACTION_AUTHORIZATION
      - HC_OWNS_LINEAGE_CURRENTNESS_UNCERTAINTY_RECONCILIATION_AND_DURABLE_MODEL_REVISION

negative_tests:
  - T2_FORECAST_DEPENDING_ON_GENERATED_T1_IS_NOT_LABELED_DIRECT_FORECAST_FROM_OBSERVED_T0
  - CASCADE_STAGE_DOES_NOT_RESET_UNCERTAINTY_WITHOUT_EXPLICIT_CALIBRATION_SCOPE
  - MULTIPLE_DESCENDANTS_FROM_ONE_PREDICTED_PARENT_DO_NOT_COUNT_AS_MULTIPLE_INDEPENDENT_SOURCES
  - PREDICTED_TIMEPOINT_IS_NOT_WRITTEN_AS_OBSERVED_HISTORY_BEFORE_OBSERVATION
  - ANCESTOR_CONTRADICTION_DOES_NOT_LEAVE_DESCENDANT_FORECAST_SILENTLY_CURRENT
  - IMPUTED_TIMEPOINT_DOES_NOT_BECOME_OBSERVED_TIMEPOINT_BY_REUSE
  - ACTION_CONDITIONAL_SUCCESS_FORECAST_DOES_NOT_CREATE_EFFECT_PERMISSION
  - PREDICTED_EDGE_DOES_NOT_DIRECTLY_MUTATE_CURRENT_TOPOLOGY
  - PROVIDER_FORECAST_DOES_NOT_GAIN_AUTHORITY_FROM_PROVIDER_CONFIDENCE

references:
  - cognition/TEMPORAL_FORECAST_LINEAGE.md
  - cognition/WORLD_MODEL_AND_PREDICTION.md
  - chronology/TEMPORAL_EVENT_CONTRACT.md
  - docs/architecture/CONNECTIVITY_INFERENCE_AND_TOPOLOGY_EVIDENCE.md
  - specs/HC_TOPOLOGY_EVIDENCE_V1.yaml
  - docs/runtime/HYPERCONNECTOME_RUNTIME_MODEL.md
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - docs/research/BASIRA_TEMPORAL_FORECAST_LINEAGE_2026-09-09.md

