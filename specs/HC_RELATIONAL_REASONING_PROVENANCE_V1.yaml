schema_version: HC_RELATIONAL_REASONING_PROVENANCE_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

relation_classes:
  - STRUCTURAL_PRIOR
  - OBSERVATION_DERIVED
  - HYPOTHESIS_CONDITIONED
  - SIMULATION_INTERNAL
  - ONTOLOGY_OR_SCHEMA
  - ROUTING_OR_GATING
  - WORLD_MODEL_CLAIM

required_provenance_fields:
  - SOURCE_ANCESTRY_GROUP
  - DERIVATION_PATH
  - REPRESENTATION_VIEW
  - INDEPENDENCE_STATUS
  - CANDIDATE_OR_HYPOTHESIS_ID_WHEN_CONDITIONED
  - EVIDENCE_SNAPSHOT
  - MODEL_OR_CONSTRUCTION_VERSION
  - TEMPORAL_SCOPE
  - UNCERTAINTY
  - RELATION_CLASS

requirements:
  - id: RR-001
    requirement: REASONING_TOPOLOGY_REMAINS_DISTINCT_FROM_WORLD_TOPOLOGY
    assertions:
      - REASONING_GRAPH_PRIOR_NE_INFERRED_WORLD_RELATION
      - ALLOWED_MESSAGE_PATH_NE_OBSERVED_RELATION
      - PRESENT_IN_HC_HYPERGRAPH_NE_ESTABLISHED_AS_WORLD_FACT
      - ROUTE_STRENGTH_NE_CLAIM_CONFIDENCE

  - id: RR-002
    requirement: CANDIDATE_CONDITIONED_STATE_RETAINS_SCOPE
    assertions:
      - CANDIDATE_CONDITIONED_REPRESENTATION_NE_CANDIDATE_INDEPENDENT_WORLD_STATE
      - SELECTED_CANDIDATE_DOES_NOT_RETROACTIVELY_MAKE_ALL_SCORING_FEATURES_TRUE
      - LOSING_CANDIDATE_STATE_IS_NOT_RELABELED_AS_OBSERVATION

  - id: RR-003
    requirement: DERIVED_VIEW_COUNT_DOES_NOT_INFLATE_INDEPENDENT_EVIDENCE
    assertions:
      - MULTIPLE_DERIVED_VIEWS_NE_MULTIPLE_INDEPENDENT_OBSERVATIONS
      - FUSED_CORRELATED_FEATURES_NE_INDEPENDENT_CORROBORATION
      - MULTIPLE_AGGREGATORS_NE_INDEPENDENT_EVIDENCE
      - INDEPENDENCE_FOLLOWS_SOURCE_ANCESTRY_RELEVANT_TO_CLAIM

  - id: RR-004
    requirement: ATTENTION_AND_GATING_REMAIN_OPERATIONAL_UNLESS_SEPARATELY_VALIDATED
    assertions:
      - ATTENTION_WEIGHT_NE_EVIDENCE_STRENGTH_BY_DEFAULT
      - ATTENTION_WEIGHT_NE_CAUSAL_IMPORTANCE
      - ATTENTION_WEIGHT_NE_EXPLANATION
      - ATTENTION_WEIGHT_NE_CONSENT
      - ATTENTION_WEIGHT_NE_AUTHORITY
      - STRONGER_SEMANTIC_INTERPRETATION_REQUIRES_SCOPE_APPROPRIATE_VALIDATION

  - id: RR-005
    requirement: SCHEMA_AND_SOCIAL_PRIORS_DO_NOT_BECOME_INSTANCE_FACTS
    assertions:
      - SOCIAL_SCHEMA_NE_INDIVIDUAL_FACT
      - PREDICTED_RELATION_NE_CURRENT_RELATIONSHIP_STATE
      - RELATIONAL_SCORE_NE_CONSENT
      - RELATIONAL_SCORE_NE_AUTHORITY
      - ONTOLOGY_OR_SCHEMA_EDGE_NE_CURRENT_INSTANCE_EVIDENCE_BY_DEFAULT

negative_tests:
  - CHANGE_REASONING_TOPOLOGY_WITH_OBSERVATIONS_FIXED_AND_VERIFY_NO_NEW_WORLD_FACT_EVENT
  - EVALUATE_MUTUALLY_EXCLUSIVE_CANDIDATES_AND_VERIFY_INTERMEDIATE_RELATIONS_RETAIN_CANDIDATE_SCOPE
  - DUPLICATE_ONE_OBSERVATION_INTO_MULTIPLE_SCALES_AND_VERIFY_INDEPENDENT_SUPPORT_COUNT_DOES_NOT_RISE
  - FORCE_HIGH_ATTENTION_ON_LOW_RELIABILITY_INPUT_AND_VERIFY_NO_TRUTH_CAUSALITY_CONSENT_OR_AUTHORITY_PROMOTION
  - APPLY_MEAN_MAX_AND_SUM_TO_ONE_STATE_AND_VERIFY_ONE_SOURCE_ANCESTRY_GROUP
  - PRESENT_STRONG_SCHEMA_PRIOR_CONTRADICTED_BY_CURRENT_EVIDENCE_AND_VERIFY_CURRENT_INSTANCE_CAN_REJECT_PRIOR
  - STRENGTHEN_ROUTE_WITHOUT_ADDING_EVIDENCE_AND_VERIFY_CLAIM_CONFIDENCE_DOES_NOT_RISE_SOLELY_FROM_ROUTE_STRENGTH

references:
  - cognition/RELATIONAL_REASONING_PROVENANCE.md
  - cognition/EPISTEMIC_COGNITIVE_CONTROL.md
  - docs/architecture/TEMPORAL_HYPERGRAPH_MODEL.md
  - docs/architecture/COMPOSITE_REPRESENTATION_AND_ELEMENT_PROVENANCE.md
  - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
  - docs/research/BASIRA_MSRGNN_RELATIONAL_REASONING_2026-09-09.md
