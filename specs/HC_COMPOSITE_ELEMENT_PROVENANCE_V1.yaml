schema_version: HC_COMPOSITE_ELEMENT_PROVENANCE_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

joint_observation_states:
  - JOINTLY_OBSERVED
  - COMPOSED_FROM_MULTIPLE_OBSERVATIONS
  - GENERATED
  - MIXED
  - UNKNOWN

requirements:
  - id: CP-001
    requirement: COMPOSITE_ORIGIN_IS_DISTINCT_FROM_SINGLE_OBSERVATION
    assertions:
      - COMPOSITE_REPRESENTATION_NE_OBSERVED_INSTANCE
      - OBJECT_LEVEL_SOURCE_SET_NE_ELEMENT_LEVEL_ANCESTRY
      - INDIVIDUALLY_SUPPORTED_ELEMENTS_NE_JOINTLY_SUPPORTED_CONFIGURATION
      - FUSED_COMPATIBILITY_NE_OBSERVED_COOCCURRENCE

  - id: CP-002
    requirement: PROVENANCE_GRANULARITY_MATCHES_CONSEQUENTIAL_DOWNSTREAM_QUESTIONS
    assertions:
      - ELEMENT_OR_REGION_LINEAGE_IS_RETAINED_WHEN_JOINT_ORIGIN_IS_MATERIAL
      - CLAIM_LEVEL_LINEAGE_IS_RETAINED_WHEN_SUMMARY_COMBINES_DISTINCT_SOURCES
      - TEMPORAL_SEGMENT_LINEAGE_IS_RETAINED_WHEN_TRAJECTORY_MIXES_EPISTEMIC_ORIGINS
      - AUTHORITY_SCOPE_LINEAGE_IS_RETAINED_WHEN_COMPOSITE_CONTAINS_MULTIPLE_GRANTS

  - id: CP-003
    requirement: GRAPH_COMPOSITION_DOES_NOT_CREATE_UNSUPPORTED_HIGHER_ORDER_EVIDENCE
    assertions:
      - ELEMENT_SELECTED_FROM_SOURCE_NE_COMPOSITE_IS_THAT_SOURCE
      - MOSAIC_REPRESENTATION_NE_COHERENT_OBSERVED_STATE
      - PAIRWISE_ELEMENTS_FROM_DIFFERENT_SOURCES_NE_JOINT_HYPEREDGE_EVIDENCE
      - POPULATION_TEMPLATE_NE_OBSERVED_INSTANCE

  - id: CP-004
    requirement: MIXED_TEMPORAL_REPRESENTATION_PRESERVES_PER_SEGMENT_ORIGIN
    assertions:
      - ONE_TRAJECTORY_OBJECT_NE_ONE_EPISTEMIC_ORIGIN
      - OBSERVED_SEGMENT_REMAINS_DISTINCT_FROM_IMPUTED_SEGMENT
      - OBSERVED_SEGMENT_REMAINS_DISTINCT_FROM_FORECAST_SEGMENT
      - ANCESTOR_CORRECTION_INVALIDATES_OR_REEVALUATES_DEPENDENT_COMPOSITE_REGIONS

  - id: CP-005
    requirement: COMPOSITE_AUTHORITY_DOES_NOT_EXPAND_SOURCE_GRANTS
    assertions:
      - SEPARATE_SCOPED_GRANTS_DO_NOT_SYNTHESIZE_UNIVERSAL_GRANT
      - EXPIRY_AND_CURRENTNESS_REMAIN_PER_SOURCE_SCOPE
      - COMPOSITE_PERMISSION_OBJECT_CANNOT_EXCEED_UNION_OF_CURRENT_AUTHORIZED_SCOPES
      - INCOMPATIBLE_OR_CONFLICTING_GRANTS_REMAIN_VISIBLE

negative_tests:
  - MOSAIC_TEMPLATE_WITH_MULTI_SOURCE_EDGES_IS_NOT_LABELED_SINGLE_OBSERVED_INSTANCE
  - INDEPENDENT_PAIRWISE_RELATIONS_DO_NOT_CREATE_JOINT_HYPEREDGE_WITHOUT_SEPARATE_SUPPORT
  - ATTRIBUTES_FROM_INCOMPATIBLE_TIMEPOINTS_DO_NOT_BECOME_ASSERTED_SIMULTANEOUS_STATE
  - SUMMARY_OF_CONFLICTING_SOURCES_PRESERVES_DISSENT_LINEAGE
  - CORRECTED_SOURCE_ELEMENT_MARKS_OR_RECOMPUTES_DEPENDENT_COMPOSITE_REGION
  - SEPARATE_PERMISSION_SCOPES_DO_NOT_COMBINE_INTO_BROADER_UNAUTHORIZED_GRANT
  - DOWNSTREAM_REASONER_CAN_QUERY_WHETHER_CONJUNCTION_WAS_JOINTLY_OBSERVED

references:
  - docs/architecture/COMPOSITE_REPRESENTATION_AND_ELEMENT_PROVENANCE.md
  - docs/architecture/REPRESENTATION_FIDELITY_AND_OBJECTIVE_PROVENANCE.md
  - docs/architecture/REFERENCE_IDENTITY_AND_INDEX_LINEAGE.md
  - docs/architecture/TEMPORAL_HYPERGRAPH_MODEL.md
  - cognition/TEMPORAL_FORECAST_LINEAGE.md
  - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
  - docs/research/BASIRA_GRN_COMPOSITE_TEMPLATE_AND_ELEMENT_PROVENANCE_2026-09-09.md
