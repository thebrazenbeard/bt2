schema_version: HC_DISTRIBUTED_LEARNING_ANCESTRY_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

ancestry_axes:
  - OBSERVATION_ANCESTRY
  - SOURCE_ANCESTRY
  - LEARNING_ANCESTRY
  - PARAMETER_ANCESTRY
  - EVALUATION_ANCESTRY
  - AUTHORITY_ANCESTRY

requirements:
  - id: DL-001
    requirement: MODEL_AND_PARAMETER_ANCESTRY_REMAIN_EXPLICIT_AFTER_AGGREGATION_OR_TRANSFER
    assertions:
      - LOCAL_MODEL_AFTER_GLOBAL_AGGREGATION_NE_INDEPENDENT_LOCAL_MODEL
      - MODEL_COUNT_NE_INDEPENDENT_MODEL_ANCESTRY_COUNT
      - SEVERAL_PARTICIPANTS_WITH_SHARED_WEIGHTS_NE_SEVERAL_INDEPENDENT_CORROBORATORS
      - NUMERICALLY_MERGED_STATE_NE_PROVENANCE_FREE_STATE
      - SHARED_PARAMETER_ANCESTRY_NE_NO_USEFUL_DIVERSITY

  - id: DL-002
    requirement: LEARNED_UPDATE_TRANSFER_DOES_NOT_FABRICATE_SOURCE_OBSERVATIONS
    assertions:
      - RECEIVED_MODEL_UPDATE_NE_OBSERVED_REMOTE_DATA
      - PARAMETER_UPDATE_ANCESTRY_NE_OBSERVATION_ANCESTRY
      - MODEL_KNOWLEDGE_TRANSFER_NE_SOURCE_EVIDENCE_TRANSFER
      - REMOTE_PRIVATE_OR_UNAVAILABLE_CASES_ARE_NOT_CREATED_AS_LOCAL_OBSERVATION_RECORDS

  - id: DL-003
    requirement: MISSING_TEMPORAL_EVIDENCE_REMAINS_MISSING_OR_GENERATED_AS_LABELED
    assertions:
      - MISSING_TIMEPOINT_NE_OBSERVED_NO_CHANGE
      - SELF_ENCODING_OBJECTIVE_NE_EVIDENCE_OF_TEMPORAL_STASIS
      - PREDICTED_BRIDGE_ACROSS_MISSING_TIMEPOINT_NE_OBSERVED_INTERMEDIATE_STATE
      - GENERATED_BRIDGE_DESCENDANTS_RETAIN_FORECAST_ANCESTRY

  - id: DL-004
    requirement: AGGREGATION_AND_CONTRIBUTOR_STRENGTH_DO_NOT_DEFINE_AUTHORITY
    assertions:
      - AGGREGATION_ELIGIBILITY_NE_UPDATE_AUTHORITY
      - PARTICIPANT_STRENGTH_SCORE_NE_PROTECTED_UPDATE_AUTHORITY
      - GLOBAL_MODEL_NE_COGNITIVE_EXECUTIVE
      - CENTRAL_COORDINATOR_NE_SEMANTIC_AUTHORITY
      - EXTERNAL_AGGREGATOR_NE_HC_EXECUTIVE
      - EXTERNAL_UPDATE_PROVIDER_NE_PROTECTED_STATE_AUTHORITY

  - id: DL-005
    requirement: DISTRIBUTED_UPDATE_PAYLOADS_PRESERVE_STATE_CLASS_AND_PROTECTED_BOUNDARIES
    assertions:
      - ORDINARY_PLASTICITY_UPDATE_CANNOT_SMUGGLE_PROTECTED_STATE_MUTATION
      - CONTRIBUTOR_PROVENANCE_SURVIVES_NUMERIC_AGGREGATION
      - CONTRIBUTION_WEIGHT_OR_EFFECTIVE_INFLUENCE_IS_RECORDED_WHEN_MATERIAL
      - SHARED_ANCESTOR_GROUPS_ARE_RETAINED_WHEN_INDEPENDENCE_CLAIMS_DEPEND_ON_THEM
      - RESULTING_UPDATE_REQUIRES_SCOPE_APPROPRIATE_AUTHORITY_AND_QUALIFICATION

  - id: DL-006
    requirement: EVALUATION_FEEDBACK_USED_TO_CONTROL_DISTRIBUTED_LEARNING_IS_NOT_UNTOUCHED_HOLDOUT_EVIDENCE
    assertions:
      - EVALUATION_FEEDBACK_USED_TO_MODIFY_OPTIMIZATION_NE_UNTOUCHED_HOLDOUT_EVIDENCE
      - SCHEDULER_STEP_FROM_EVALUATION_SCORE_IS_ADAPTATION_FEEDBACK
      - CONTRIBUTOR_WEIGHT_OR_ORDER_SELECTED_FROM_EVALUATION_SCORE_IS_SELECTION_FEEDBACK
      - STOPPING_OR_MODEL_SELECTION_FROM_EVALUATION_SCORE_IS_SELECTION_FEEDBACK

  - id: DL-007
    requirement: DESCENDANTS_REMAIN_TRACEABLE_AFTER_CONTRIBUTOR_INVALIDATION
    assertions:
      - CONTRIBUTOR_INVALIDATED_NE_HISTORY_ERASED
      - AFFECTED_DESCENDANTS_CAN_BE_IDENTIFIED_FOR_REQUALIFICATION_OR_RECOMPUTATION
      - ROLLBACK_TARGET_NE_AUTOMATICALLY_SAFE_CURRENT_STATE
      - CONTINUITY_SAFE_UPDATE_GOVERNANCE_STILL_APPLIES

  - id: DL-008
    requirement: CONFIGURED_DISTRIBUTED_LEARNING_STRATEGY_CONTROLS_THE_EXECUTED_EFFECT_PATH
    assertions:
      - CONFIGURED_STRATEGY_NE_EXECUTED_STRATEGY_WITHOUT_PATH_VERIFICATION
      - SELECTED_POLICY_OBJECT_NE_EFFECT_PATH_USES_SELECTED_POLICY
      - FEATURE_FLAG_SET_NE_GUARANTEED_BEHAVIOR_CHANGE
      - EXECUTED_AGGREGATION_OR_EXCHANGE_PATH_IS_TRACEABLE_TO_SELECTED_MODE_WHEN_MATERIAL
      - TARGET_ARGUMENT_PRESENT_NE_TARGET_DATA_EXECUTED
      - METHOD_SIGNATURE_NE_DATAFLOW_PROOF

  - id: DL-009
    requirement: REPLICA_AND_PERTURBATION_DESCENDANTS_RETAIN_COMMON_SOURCE_ANCESTRY
    assertions:
      - REPLICA_COUNT_NE_INDEPENDENT_SOURCE_COUNT
      - PERTURBED_OR_SUBSET_COPY_NE_NEW_OBSERVATION_SOURCE
      - REPLICA_MODEL_NE_INDEPENDENT_MODEL_ANCESTRY
      - GENERATED_OR_PERTURBED_VARIANTS_NE_INDEPENDENT_SOURCE_OBSERVATIONS
      - MODEL_DIVERSITY_NE_EVIDENCE_INDEPENDENCE
      - MULTIPLE_REPLICA_VOTES_NE_MULTIPLE_INDEPENDENT_OBSERVERS
      - STOCHASTIC_DIVERGENCE_DOES_NOT_ERASE_COMMON_ANCESTRY

  - id: DL-010
    requirement: DECLARED_AGGREGATION_WEIGHTS_MATCH_EFFECTIVE_CONTRIBUTOR_INFLUENCE
    assertions:
      - DECLARED_WEIGHT_NE_EFFECTIVE_INFLUENCE_WITHOUT_EXECUTION_TRACE
      - NAMED_EQUAL_WEIGHT_AGGREGATION_NE_VERIFIED_EFFECTIVE_WEIGHT_SEMANTICS
      - REPEATED_SCALING_OR_AVERAGING_IS_INCLUDED_IN_EFFECTIVE_WEIGHT_CALCULATION
      - EFFECTIVE_INFLUENCE_IS_TESTABLE_AT_MATERIAL_UPDATE_BOUNDARY
      - EFFECTIVE_WEIGHT_DOES_NOT_CONFER_AUTHORITY

  - id: DL-011
    requirement: HETEROGENEOUS_MODEL_STATE_IS_TRANSFERRED_ONLY_ACROSS_VERIFIED_SEMANTICALLY_HOMOLOGOUS_PARAMETER_OR_STATE_ROLES
    assertions:
      - SHAPE_COMPATIBLE_PARAMETER_NE_SEMANTICALLY_HOMOLOGOUS_PARAMETER
      - SAME_PARAMETER_NAME_NE_SAME_ARCHITECTURAL_ROLE_WITHOUT_CORRESPONDENCE
      - HETEROGENEOUS_TRANSFER_REQUIRES_EXPLICIT_PARAMETER_ROLE_MAPPING
      - SHARED_PARAMETER_ROLE_RETAINS_COORDINATE_STATE_FAMILY_AND_VERSION_COMPATIBILITY
      - ASSIGNMENT_SUCCESS_NE_SEMANTIC_TRANSFER_VALIDITY

negative_tests:
  - AGGREGATE_INDEPENDENT_MODELS_THEN_VERIFY_POST_AGGREGATION_VOTES_ARE_NOT_COUNTED_AS_FULLY_INDEPENDENT_MODEL_EVIDENCE
  - TRANSFER_MODEL_UPDATE_WITHOUT_SOURCE_OBSERVATIONS_AND_VERIFY_NO_REMOTE_OBSERVATION_RECORDS_ARE_FABRICATED
  - SELF_RECONSTRUCT_ACROSS_MISSING_TIMEPOINT_AND_VERIFY_NO_OBSERVED_NO_CHANGE_FACT_IS_CREATED
  - PREDICT_THROUGH_MISSING_INTERVAL_AND_VERIFY_DESCENDANTS_RETAIN_GENERATED_ANCESTRY
  - MIX_PROTECTED_AND_ORDINARY_STATE_IN_ONE_AGGREGATION_PAYLOAD_AND_REQUIRE_TYPED_REJECTION_OR_SEPARATE_AUTHORIZATION
  - RANK_CONTRIBUTORS_BY_PERFORMANCE_AND_VERIFY_RANK_DOES_NOT_CONFER_PROTECTED_AUTHORITY
  - USE_HOLDOUT_SCORE_TO_CHANGE_SCHEDULER_WEIGHT_ORDER_OR_SELECTION_AND_RECLASSIFY_EVIDENCE_AS_TUNING_OR_SELECTION
  - FORK_MANY_MODELS_FROM_ONE_ANCESTOR_AND_VERIFY_COMMON_ANCESTRY_SURVIVES_ENSEMBLE_OR_AGGREGATION
  - CREATE_MANY_REPLICAS_FROM_ONE_CLIENT_DATASET_AND_VERIFY_INDEPENDENT_SOURCE_COUNT_DOES_NOT_RISE
  - PERTURB_OR_SUBSET_ONE_SOURCE_IN_MANY_WAYS_AND_VERIFY_VARIANTS_RETAIN_COMMON_SOURCE_ANCESTRY
  - INVALIDATE_ONE_UPSTREAM_CONTRIBUTOR_AND_IDENTIFY_ALL_DEPENDENT_DESCENDANTS
  - REMOVE_EXTERNAL_AGGREGATOR_AND_VERIFY_ESSENTIAL_HC_COGNITION_AND_CONTINUITY_REMAIN_INTERNAL
  - SELECT_TWO_DISTINCT_DISTRIBUTED_STRATEGIES_AND_VERIFY_THE_EXECUTED_EFFECT_PATH_CHANGES_ACCORDINGLY
  - SUPPLY_DISTINCT_SOURCE_AND_TARGET_SENTINELS_AND_VERIFY_ACTUAL_LEARNING_PATH_CONSUMES_DECLARED_TARGET
  - CONFIGURE_KNOWN_AGGREGATION_WEIGHTS_AND_USE_BASIS_VECTOR_CONTRIBUTORS_TO_MEASURE_EFFECTIVE_INFLUENCE
  - APPLY_DECLARED_WEIGHT_THEN_EXTRA_MEAN_AND_REQUIRE_INFLUENCE_TEST_TO_DETECT_UNDECLARED_SCALING
  - CREATE_SAME_SHAPED_SAME_NAMED_PARAMETERS_WITH_DIFFERENT_ARCHITECTURAL_ROLES_AND_REQUIRE_HETEROGENEOUS_TRANSFER_REJECTION

references:
  - docs/architecture/DISTRIBUTED_LEARNING_AND_UPDATE_ANCESTRY.md
  - docs/architecture/REPRESENTATION_FIDELITY_AND_OBJECTIVE_PROVENANCE.md
  - docs/architecture/REFERENCE_IDENTITY_AND_INDEX_LINEAGE.md
  - docs/architecture/EXECUTED_DATAFLOW_AND_BINDING_INTEGRITY.md
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
  - cognition/TEMPORAL_FORECAST_LINEAGE.md
  - docs/architecture/RUNTIME_COMPONENT_REGISTRATION_AND_STATE_CUSTODY.md
  - docs/research/BASIRA_4D_FED_GNN_DISTRIBUTED_LEARNING_2026-09-09.md
  - docs/research/BASIRA_REPFL_REPLICA_ANCESTRY_AND_TARGET_DATAFLOW_2026-09-09.md
