  emergency_access_grants_universal_admin_authority: false
  rollback_technical_possibility_equals_continuity_safety: false
  system_update_grants_memory_rewrite_authority: false
  system_update_grants_value_rewrite_authority: false
  system_update_grants_consent_override: false
  partial_component_write_equals_semantic_activation: false
  self_test_pass_equals_behavioral_qualification: false
  protected_update_must_preserve_when_material:
