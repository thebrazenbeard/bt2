  rules:
    - PLASTIC_UPDATE_DOES_NOT_EQUAL_PROTECTED_ARCHITECTURE_UPDATE
    - MAINTENANCE_ACCESS_DOES_NOT_EQUAL_UPDATE_AUTHORITY
    - UPDATE_PACKAGE_AVAILABLE_DOES_NOT_EQUAL_UPDATE_AUTHORIZED
    - SIGNED_ARTIFACT_DOES_NOT_EQUAL_SEMANTICALLY_SAFE_UPDATE
    - CRYPTOGRAPHIC_INTEGRITY_DOES_NOT_EQUAL_EFFECT_AUTHORITY
    - UPDATE_INSTALLED_DOES_NOT_EQUAL_UPDATE_ACTIVATED
    - UPDATE_ACTIVATED_DOES_NOT_EQUAL_UPDATE_QUALIFIED
    - SYSTEM_UPDATE_DOES_NOT_EQUAL_MEMORY_REWRITE_AUTHORITY
    - SYSTEM_UPDATE_DOES_NOT_EQUAL_VALUE_REWRITE_AUTHORITY
    - SYSTEM_UPDATE_DOES_NOT_EQUAL_CONSENT_OVERRIDE
    - UPDATE_GOVERNANCE_CHANGE_DOES_NOT_EQUAL_ROUTINE_MAINTENANCE
    - PROTECTED_ACTIVATION_IS_ATOMIC_AT_SEMANTIC_BOUNDARY_OR_EXPLICITLY_JOURNALED
    - INCOMPATIBLE_DISTRIBUTED_CONSTITUENT_REMAINS_INHIBITED_OR_QUARANTINED
    - SHADOW_CANARY_OR_SIMULATION_SUCCESS_DOES_NOT_CREATE_ACTIVATION_AUTHORITY
    - BLIND_ROLLBACK_MUST_NOT_ERASE_VALID_CONTINUITY_BEARING_HISTORY
    - RETURNED_OR_UPDATED_COMPONENT_REQUIRES_SCOPE_APPROPRIATE_REQUALIFICATION
    - EXTERNAL_RECOVERY_OR_UPDATE_PROVIDER_DOES_NOT_GAIN_PROTECTED_STATE_AUTHORITY

runtime_state_separation:
