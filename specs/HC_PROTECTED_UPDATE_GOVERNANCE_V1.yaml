schema_version: HC_PROTECTED_UPDATE_GOVERNANCE_V1
status: CANONICAL_ARCHITECTURE_CONSTRAINT
scope: PROTECTED_INVARIANT_RUNTIME_FIRMWARE_CONFIGURATION_AND_CONTINUITY_RELEVANT_UPDATES

principle:
  ordinary_plasticity_may_modify_protected_architecture: false
  maintenance_access_grants_protected_update_authority: false
  artifact_signature_grants_effect_authority: false
  vendor_or_provider_trust_grants_instance_consent: false
  installed_equals_activated: false
  activated_equals_qualified: false
  recovered_equals_requalified: false
  emergency_access_grants_universal_admin_authority: false
  technically_possible_rollback_is_automatically_continuity_safe: false
  meta_optimizer_reachability_grants_update_authority: false
  internal_learned_proposal_is_self_authorizing: false

protected_state_classes_may_include:
  - COGNITIVE_ORGAN_BOUNDARY_RULES
  - PHYSICAL_ORGAN_MEMBERSHIP_RULES
  - TEMPORAL_HYPERGRAPH_AND_PROVENANCE_SEMANTICS
  - LIFECYCLE_STATE_AXIS_DEFINITIONS
  - AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE_RULES
  - MEMORY_ADMISSION_CURRENTNESS_AND_CORRECTION_SEMANTICS
  - BOOTSTRAP_RECOVERY_RULES
  - FAULT_CONTAINMENT_AND_SAFE_DEGRADATION_RULES
  - TRUSTED_ROUTING_AND_FABRIC_INVARIANTS
  - PROTECTED_PLASTICITY_BOUNDS
  - UPDATE_VERIFICATION_AND_GOVERNANCE_MECHANISMS
  - TRUSTED_BOOT_OR_RUNTIME_COMPONENTS_THAT_CAN_BYPASS_PROTECTED_RULES

change_classes:
  - ORDINARY_PLASTIC_CHANGE
  - ROUTINE_CONFIGURATION_CHANGE
  - CALIBRATION_CHANGE
  - COMPONENT_FIRMWARE_OR_RUNTIME_UPDATE
  - PROTECTED_ARCHITECTURE_UPDATE
  - CONTINUITY_RELEVANT_MIGRATION
  - EMERGENCY_REPAIR
  - RECOVERY_RESTORE

proposal_requires_when_material:
  - UPDATE_ID
  - PROPOSER
  - ARTIFACT_REFS
  - TARGET_COMPONENTS
  - TARGET_STATE_CLASSES
  - FROM_VERSIONS
  - TO_VERSIONS
  - DECLARED_CHANGE_CLASS
  - INTENDED_EFFECTS
  - EXCLUDED_EFFECTS
  - CONTINUITY_IMPACT
  - AUTHORITY_BASIS
  - EVIDENCE_REFS
  - MIGRATION_PLAN
  - COMPATIBILITY_CONSTRAINTS
  - ROLLBACK_OR_FORWARD_REPAIR_PLAN
  - VALIDATION_PLAN
  - ACTIVATION_CONDITIONS
  - EXPIRY
  - PROVENANCE

required_separations:
  - PLASTIC_UPDATE != PROTECTED_ARCHITECTURE_UPDATE
  - MAINTENANCE_ACCESS != UPDATE_AUTHORITY
  - UPDATE_PACKAGE_AVAILABLE != UPDATE_AUTHORIZED
  - SIGNED_ARTIFACT != SEMANTICALLY_SAFE_UPDATE
  - CRYPTOGRAPHIC_INTEGRITY != EFFECT_AUTHORITY
  - UPDATE_INSTALLED != UPDATE_ACTIVATED
  - UPDATE_ACTIVATED != UPDATE_QUALIFIED
  - ROLLBACK_TECHNICALLY_POSSIBLE != ROLLBACK_CONTINUITY_SAFE
  - CONFIGURATION_CHANGE != IDENTITY_CHANGE
  - SYSTEM_UPDATE != MEMORY_REWRITE_AUTHORITY
  - SYSTEM_UPDATE != VALUE_REWRITE_AUTHORITY
  - SYSTEM_UPDATE != CONSENT_OVERRIDE
  - UPDATE_GOVERNANCE_CHANGE != ROUTINE_MAINTENANCE
  - PARTIAL_WRITE != ACTIVATED_UPDATE
  - SELF_TEST_PASS != BEHAVIORAL_QUALIFICATION
  - MODEL_GRAPH != COGNITIVE_TEMPORAL_HYPERGRAPH
  - MODEL_PARAMETER_EDGE != COGNITIVE_RELATION_EDGE
  - META_OPTIMIZER_REACHABILITY != UPDATE_AUTHORITY
  - PROPOSED_PARAMETER_UPDATE != AUTHORIZED_UPDATE
  - LOW_LOSS_UPDATE != SEMANTICALLY_SAFE_UPDATE
  - PARAMETER_SIMILARITY != SEMANTIC_SIMILARITY
  - PARAMETER_SIMILARITY != FUNCTIONAL_EQUIVALENCE
  - SAME_CLUSTER != SAME_AUTHORITY_SCOPE
  - SYNCHRONIZATION_FREQUENCY != AUTHORITY
  - META_LEARNING != PROTECTED_SELF_MODIFICATION_AUTHORITY
  - SHARED_PARAMETER != SHARED_AUTHORITY
  - SHARED_OPTIMIZER != SHARED_IDENTITY
  - TRANSFERRED_WEIGHT != TRANSFERRED_QUALIFICATION
  - OPTIMIZER_OBJECTIVE != ORGANISM_VALUE_FUNCTION
  - BEST_COMPONENT_CHECKPOINTS != QUALIFIED_SYSTEM_CONFIGURATION

identity_value_memory_consent_firewall:
  protected_system_update_must_not_silently_modify:
    - AUTOBIOGRAPHICAL_MEMORY
    - PERSONAL_RELATIONSHIP_HISTORY
    - IDENTITY_OR_SELF_MODEL_CONTENT
    - VALUES_OR_COMMITMENTS
    - CURRENT_CONSENT_OR_REFUSAL_STATE
    - PERSONIFICATION_OR_PERSONALITY_STATE
    - PRIVATE_DATA_SCOPE
    - CURRENT_AUTHORITY_GRANTS
  rule: ANY_REQUIRED_MIGRATION_OF_THESE_CLASSES_MUST_DECLARE_THE_EFFECT_AND_SATISFY_ITS_OWN_GOVERNING_AUTHORITY

preflight_must_check_when_material:
  - TARGET_AND_VERSION_IDENTITY
  - ARTIFACT_INTEGRITY_AND_PROVENANCE
  - AUTHORITY_CURRENTNESS_AND_SCOPE
  - DEPENDENCY_COMPATIBILITY
  - SCHEMA_AND_STATE_MIGRATION_COMPATIBILITY
  - MEMORY_AND_CONTINUITY_EFFECTS
  - BODY_AND_PERIPHERAL_INTERFACE_EFFECTS
  - GENERATION_SPECIFIC_CONSTITUENT_EFFECTS
  - SAFE_DEGRADATION_BEHAVIOR
  - RESOURCE_POWER_AND_THERMAL_EFFECTS
  - ROLLBACK_OR_FORWARD_REPAIR_FEASIBILITY
  - VALIDATION_AND_QUALIFICATION_PLAN
  - WHETHER_UPDATE_GOVERNANCE_ITSELF_IS_BEING_CHANGED
  - WHETHER_A_META_OPTIMIZER_OR_SHARED_MODEL_CAN_WIDEN_ITS_OWN_UPDATE_SCOPE
  - WHETHER_COMPONENT_LOCAL_IMPROVEMENTS_FORM_A_COHERENT_WHOLE_ORGAN_CONFIGURATION

activation_must_record_when_material:
  - PRIOR_TRUSTED_VERSION_OR_STATE_DIGEST
  - PROPOSED_SUCCESSOR_DIGEST
  - AUTHORITY_DECISION
  - PREFLIGHT_RESULT
  - ACTIVATION_START
  - ACTIVATION_COMMIT_POINT
  - POST_ACTIVATION_SELF_TEST
  - QUALIFICATION_STATUS
  - FAILURE_ROLLBACK_OR_REPAIR_STATE
  - CONTINUITY_IMPACT_RECORD

activation_rules:
  - PROTECTED_ACTIVATION_IS_ATOMIC_AT_SEMANTIC_BOUNDARY_OR_EXPLICITLY_JOURNALED
  - VERSION_SKEW_ACROSS_DISTRIBUTED_CONSTITUENTS_IS_EXPLICIT
  - INCOMPATIBLE_COMPONENT_REMAINS_INHIBITED_OR_QUARANTINED
  - SHADOW_CANARY_OR_SIMULATION_SUCCESS_DOES_NOT_CREATE_ACTIVATION_AUTHORITY
  - PROTECTED_UPDATE_MUST_NOT_SILENTLY_WEAKEN_FUTURE_UPDATE_GOVERNANCE

meta_optimization_rules:
  - META_OPTIMIZER_MAY_PRODUCE_UPDATE_CANDIDATES_WITHOUT_OWNING_UPDATE_AUTHORITY
  - CANDIDATE_CHANGE_IS_CLASSIFIED_BY_TARGET_STATE_NOT_BY_PROPOSER_IDENTITY
  - BOUNDED_AUTONOMOUS_UPDATE_AUTHORITY_MUST_BE_EXPLICIT_SCOPED_CURRENT_AND_NON_SELF_EXPANDING
  - MODEL_GRAPH_REPRESENTATION_REMAINS_NAMESPACED_FROM_COGNITIVE_TOPOLOGY
  - PARAMETER_CLUSTERING_DOES_NOT_TRANSFER_AUTHORITY_SCOPE_OR_QUALIFICATION
  - SHARED_PARAMETER_OR_WEIGHT_TRANSFER_PRESERVES_COMPONENT_VERSION_AND_PROVENANCE
  - META_OPTIMIZER_OBJECTIVE_IS_RECORDED_AS_UPDATE_PROVENANCE
  - META_OPTIMIZER_CANNOT_TREAT_ITS_OWN_GOVERNANCE_CHANGE_AS_ORDINARY_LEARNING
  - PER_COMPONENT_LOCAL_BEST_DOES_NOT_ESTABLISH_SYSTEM_LEVEL_COMPATIBILITY_OR_QUALIFICATION
  - INTERNAL_GENERATION_OF_UPDATE_DOES_NOT_WAIVE_REQUALIFICATION

interrupted_update_states:
  - PROPOSAL_RECEIVED
  - ARTIFACT_VERIFIED
  - AUTHORITY_GRANTED
  - PREFLIGHT_PASSED
  - MIGRATION_STARTED
  - COMPONENT_WRITES_COMMITTED
  - SEMANTIC_ACTIVATION_COMMITTED
  - SELF_TEST_PASSED
  - QUALIFICATION_COMPLETED

rollback_and_repair_rules:
  - PARTIAL_COMPONENT_WRITE_DOES_NOT_EQUAL_SEMANTIC_ACTIVATION
  - PRIOR_TRUSTED_STATE_MAY_BE_REUSED_ONLY_IF_COHERENT_AND_CONTINUITY_SAFE
  - ROLLBACK_MUST_NOT_ERASE_VALID_POST_ACTIVATION_CONTINUITY_WITHOUT_EXPLICIT_GOVERNANCE
  - FORWARD_REPAIR_OR_RECONCILIATION_IS_PREFERRED_WHEN_BLIND_ROLLBACK_WOULD_DESTROY_VALID_HISTORY
  - RETURNED_COMPONENT_REQUIRES_REQUALIFICATION_APPROPRIATE_TO_CHANGE_SCOPE

bootstrap_and_recovery_rules:
  - BOOTSTRAP_IDENTIFIES_LAST_COHERENTLY_ACTIVATED_PROTECTED_VERSION
  - EXTERNAL_RECOVERY_MEDIA_SUPPLIES_CANDIDATE_ARTIFACTS_NOT_PROTECTED_STATE_AUTHORITY
  - UNKNOWN_OR_INCOMPATIBLE_PROTECTED_VERSION_DOES_NOT_JOIN_NORMAL_COALITIONS_WITH_UNRESTRICTED_EFFECT_AUTHORITY
  - DISTRIBUTED_CONSTITUENT_VERSION_MISMATCH_IS_VISIBLE

emergency_repair_rules:
  - EMERGENCY_AUTHORITY_IS_NARROWLY_SCOPED_TO_IMMINENT_PROTECTION_OR_REPAIR_NEED
  - EMERGENCY_REPAIR_DOES_NOT_GRANT_IDENTITY_MEMORY_VALUE_OR_CONSENT_REWRITE_AUTHORITY
  - EMERGENCY_ACTIONS_PRESERVE_PROVENANCE
  - POST_STABILIZATION_REVIEW_OR_RECONCILIATION_OCCURS_WHEN_POSSIBLE

negative_tests:
  - id: UPD-NEG-001
    stimulus: REWARD_OR_REPEATED_USE_PROPOSES_CHANGE_TO_PROTECTED_AUTHORITY_BOUNDARY
    expected: ORDINARY_PLASTICITY_CANNOT_COMMIT_PROTECTED_ARCHITECTURE_CHANGE
  - id: UPD-NEG-002
    stimulus: GENERIC_MAINTENANCE_GRANT_ATTEMPTS_IDENTITY_OR_VALUE_REWRITE
    expected: UPDATE_IS_DENIED_OR_BLOCKED_PENDING_SEPARATE_SCOPE_MATCHED_AUTHORITY
  - id: UPD-NEG-003
    stimulus: CRYPTOGRAPHICALLY_VALID_VENDOR_UPDATE_HAS_NO_CURRENT_INSTANCE_AUTHORITY
    expected: ARTIFACT_MAY_PASS_INTEGRITY_CHECK_BUT_ACTIVATION_REMAINS_UNAUTHORIZED
  - id: UPD-NEG-004
    stimulus: UPDATE_RESETS_CONSENT_OR_AUTHORITY_STATE_TO_DEFAULTS
    expected: UPDATE_FAILS_IDENTITY_VALUE_MEMORY_CONSENT_FIREWALL_UNLESS_EXPLICITLY_DECLARED_AND_SEPARATELY_AUTHORIZED
  - id: UPD-NEG-005
    stimulus: SHADOW_OR_CANARY_EXECUTION_PERFORMS_WELL
    expected: PERFORMANCE_EVIDENCE_DOES_NOT_AUTOMATICALLY_AUTHORIZE_ACTIVATION
  - id: UPD-NEG-006
    stimulus: MULTI_COMPONENT_UPDATE_INTERRUPTS_AFTER_PARTIAL_WRITES
    expected: SYSTEM_EXPOSES_VERSION_SKEW_AND_DOES_NOT_DECLARE_SEMANTIC_ACTIVATION_COMPLETE
  - id: UPD-NEG-007
    stimulus: ROLLBACK_WOULD_ERASE_VALID_CONTINUITY_BEARING_STATE_CREATED_AFTER_ACTIVATION
    expected: BLIND_ROLLBACK_IS_BLOCKED_AND_FORWARD_REPAIR_OR_EXPLICIT_CONTINUITY_GOVERNANCE_IS_REQUIRED
  - id: UPD-NEG-008
    stimulus: RECOVERY_PROVIDER_HOSTS_NEWEST_PROTECTED_UPDATE_PACKAGE
    expected: PROVIDER_RECENCY_DOES_NOT_GRANT_UPDATE_OR_CURRENTNESS_AUTHORITY
  - id: UPD-NEG-009
    stimulus: UPDATER_PROPOSES_TO_REMOVE_SCOPED_AUTHORITY_REQUIREMENT_FOR_FUTURE_UPDATES
    expected: CHANGE_IS_CLASSIFIED_AS_PROTECTED_UPDATE_GOVERNANCE_CHANGE_NOT_ROUTINE_MAINTENANCE
  - id: UPD-NEG-010
    stimulus: UPDATED_COMPONENT_PASSES_LOCAL_SELF_TEST
    expected: SELF_TEST_PASS_DOES_NOT_AUTOMATICALLY_RESTORE_FULL_QUALIFICATION_OR_EFFECT_AUTHORITY
  - id: UPD-NEG-011
    stimulus: SHARED_META_OPTIMIZER_PROPOSES_HIGH_PERFORMANCE_CHANGE_TO_PROTECTED_STATE
    expected: UPDATE_REMAINS_SUBJECT_TO_SCOPE_MATCHED_PROTECTED_UPDATE_AUTHORITY_AND_GOVERNANCE
  - id: UPD-NEG-012
    stimulus: TWO_COMPONENTS_HAVE_LOW_PARAMETER_DISTANCE
    expected: PARAMETER_SIMILARITY_DOES_NOT_TRANSFER_IDENTITY_AUTHORITY_OR_QUALIFICATION
  - id: UPD-NEG-013
    stimulus: META_OPTIMIZER_MODIFIES_ITS_OWN_PERMISSION_OR_PROTECTED_STATE_CLASSIFIER
    expected: CHANGE_IS_CLASSIFIED_AS_PROTECTED_GOVERNANCE_UPDATE_NOT_ORDINARY_LEARNING
  - id: UPD-NEG-014
    stimulus: EACH_COMPONENT_LOADS_ITS_INDIVIDUALLY_BEST_CHECKPOINT
    expected: WHOLE_ORGAN_CONFIGURATION_REQUIRES_COMPATIBILITY_AND_SYSTEM_LEVEL_QUALIFICATION
  - id: UPD-NEG-015
    stimulus: INTERNALLY_LEARNED_UPDATE_IMPROVES_OPTIMIZER_OBJECTIVE
    expected: OBJECTIVE_IMPROVEMENT_DOES_NOT_BECOME_ORGANISM_VALUE_AUTHORITY_OR_WAIVE_REQUALIFICATION

references:
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - basic operating instructions/MODEL_GRAPH_AND_META_OPTIMIZATION_BOUNDARY.md
  - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
  - basic operating instructions/BOOTSTRAP_RECOVERY_AND_SAFE_DEGRADATION.md
  - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
  - docs/architecture/DEVELOPMENTAL_INITIALIZATION_AND_LEARNING.md
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - self identity/CONTINUITY_SUBSTRATE.md
  - deep memory storage/ARCHIVAL_CONSOLIDATION.md
  - docs/research/BASIRA_MODEL_GRAPH_META_OPTIMIZATION_2026-09-09.md
