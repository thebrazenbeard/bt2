schema_version: HC_REPRESENTATION_ALIGNMENT_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

requirements:
  - id: ALIGN-001
    requirement: TRANSFORMATION_LINEAGE_REMAINS_EXPLICIT
    assertions:
      - ALIGNED_REPRESENTATION_NE_ORIGINAL_REPRESENTATION
      - TRANSFORM_MODEL_VERSION_AND_CONFIGURATION_ARE_RETAINED
      - SOURCE_AND_TARGET_DOMAINS_ARE_RETAINED
      - SOURCE_AND_TARGET_RESOLUTIONS_ARE_RETAINED
      - SOURCE_AND_TARGET_ONTOLOGIES_ARE_RETAINED_WHEN_MATERIAL
      - ORIGINAL_SOURCE_REMAINS_DISTINGUISHABLE_FROM_DERIVED_STATE

  - id: ALIGN-002
    requirement: NON_ISOMORPHIC_CORRESPONDENCE_REMAINS_UNCERTAIN_WHERE_UNPROVEN
    assertions:
      - ONE_TO_ONE_CORRESPONDENCE_SUPPORTED
      - ONE_TO_MANY_CORRESPONDENCE_SUPPORTED
      - MANY_TO_ONE_CORRESPONDENCE_SUPPORTED
      - MANY_TO_MANY_CORRESPONDENCE_SUPPORTED
      - UNMATCHED_SOURCE_ELEMENTS_SUPPORTED
      - UNMATCHED_TARGET_ELEMENTS_SUPPORTED
      - GENERATED_TARGET_ELEMENTS_SUPPORTED
      - CORRESPONDENCE_CONFIDENCE_OR_UNCERTAINTY_RETAINED_WHEN_CONSEQUENTIAL
      - MAPPED_TO_COMMON_REFERENCE_NE_PROVEN_SAME_ENTITY
      - SOFT_CORRESPONDENCE_WEIGHT_NE_IDENTITY_PROBABILITY_UNLESS_SEPARATELY_CALIBRATED_AND_QUALIFIED
      - HARD_NEAREST_REFERENCE_ASSIGNMENT_NE_PROVEN_ENTITY_IDENTITY

  - id: ALIGN-003
    requirement: RESOLUTION_CHANGE_PRESERVES_EPISTEMIC_ORIGIN
    assertions:
      - FINER_RESOLUTION_NE_FINER_MEASUREMENT
      - MORE_NODES_NE_MORE_EVIDENCE
      - GENERATED_HIGH_RESOLUTION_DETAIL_REMAINS_GENERATED
      - COMPRESSED_STATE_REMAINS_DISTINCT_FROM_ORIGINAL_STATE
      - RESTORED_FROM_COMPRESSION_REMAINS_DISTINCT_FROM_DIRECT_SOURCE

  - id: ALIGN-004
    requirement: GENERATED_OR_ALIGNED_STATE_CANNOT_DIRECTLY_MUTATE_AUTHORITATIVE_HC_STATE
    assertions:
      - GENERATED_EDGE_NE_ADMITTED_EDGE
      - DISTRIBUTION_ALIGNMENT_NE_SEMANTIC_EQUIVALENCE
      - CYCLE_CONSISTENCY_NE_SEMANTIC_CORRECTNESS
      - DISCRIMINATOR_SUCCESS_NE_GROUND_TRUTH
      - DISTILLED_KNOWLEDGE_NE_OBSERVATION
      - REFERENCE_TEMPLATE_NE_INSTANCE_AUTHORITY

  - id: ALIGN-005
    requirement: COMPRESSION_DECLARATIONS_INCLUDE_LOSS_AND_PROTECTED_RETENTION
    assertions:
      - COMPRESSION_HAS_DECLARED_LOSS_PROFILE
      - LOW_CENTRALITY_NE_SAFE_TO_DROP
      - LOW_SALIENCE_NE_SAFE_TO_DROP
      - CURRENT_AUTHORITY_AND_REVOCATION_RETAINED
      - CONSENT_AND_BOUNDARY_STATE_RETAINED
      - PROVENANCE_RETAINED
      - CHRONOLOGY_AND_CURRENTNESS_RETAINED
      - IDENTITY_AND_CONTINUITY_LINEAGE_RETAINED
      - ACTIVE_FAULT_AND_QUARANTINE_STATE_RETAINED
      - PROTECTED_UPDATE_STATE_RETAINED
      - UNRESOLVED_CONTRADICTIONS_RETAINED
      - NON_IDEMPOTENT_EFFECT_RECONCILIATION_STATE_RETAINED

  - id: ALIGN-006
    requirement: REVERSIBILITY_OR_INFORMATION_PRESERVATION_CLAIMS_REQUIRE_TESTING
    assertions:
      - ROUND_TRIP_TEST_REQUIRED_FOR_REVERSIBILITY_CLAIM
      - PROTECTED_FIELD_RETENTION_TEST_REQUIRED_FOR_CONSEQUENTIAL_COMPRESSION
      - ROUND_TRIP_SUCCESS_NE_SEMANTIC_TRUTH
      - UNPOOLING_NE_VERIFIED_RESTORATION_WITHOUT_TEST

  - id: ALIGN-007
    requirement: DISTRIBUTED_AGGREGATION_PRESERVES_SOURCE_LINEAGE_AND_DISAGREEMENT
    assertions:
      - PARTICIPATING_SOURCES_RETAINED
      - SOURCE_VERSION_AND_APPLICABILITY_RETAINED_WHEN_MATERIAL
      - MATERIAL_DISAGREEMENT_REMAINS_RECOVERABLE
      - AGGREGATION_METHOD_AND_WEIGHTING_RETAINED
      - AGGREGATED_MODEL_NE_CONSENSUS_TRUTH
      - AGGREGATION_WEIGHT_NE_EPISTEMIC_AUTHORITY
      - FEDERATED_PARTICIPATION_NE_INDEPENDENT_CORROBORATION
      - REPLICA_NE_INDEPENDENT_SOURCE
      - PERTURBED_COPY_NE_INDEPENDENT_CORROBORATION
      - SOURCE_DEPENDENCY_LINEAGE_RETAINED_WHEN_INDEPENDENCE_MATTERS
      - CONVERGENCE_TO_SHARED_CENTER_NE_CORRECTNESS
      - CONSISTENCY_LOSS_NE_TRUTH

  - id: ALIGN-008
    requirement: RAPID_ADAPTATION_REMAINS_GOVERNED_PLASTICITY
    assertions:
      - FAST_ADAPTATION_NE_AUTOMATIC_REQUALIFICATION
      - ADAPTED_NE_REQUALIFIED
      - PROTECTED_INVARIANTS_SURVIVE_ADAPTATION
      - CONSEQUENCE_PROPORTIONAL_REVALIDATION_FOLLOWS_MATERIAL_DOMAIN_OR_EMBODIMENT_CHANGE

  - id: ALIGN-009
    requirement: REPRODUCIBILITY_IS_RECORDED_AS_QUALIFICATION_EVIDENCE
    assertions:
      - HIGH_ACCURACY_NE_REPRODUCIBLE_MECHANISM
      - REPRODUCIBLE_NE_TRUE
      - NOT_REPRODUCIBLE_NE_AUTOMATICALLY_FALSE
      - MATERIAL_LEARNED_TOPOLOGY_IS_TESTABLE_ACROSS_REASONABLE_PERTURBATIONS
      - MATERIAL_REPRESENTATION_TRANSFORMS_ARE_TESTABLE_ACROSS_REASONABLE_PERTURBATIONS

  - id: ALIGN-010
    requirement: REPRESENTATION_FIDELITY_IS_SCOPED_TO_DECLARED_TEST_DIMENSIONS
    assertions:
      - MATCHED_TOPOLOGY_METRIC_NE_MATCHED_TOPOLOGY
      - TOPOLOGY_REGULARIZED_NE_TOPOLOGY_VERIFIED
      - ONE_METRIC_PASS_NE_REPRESENTATION_FIDELITY_PASS
      - EIGENVECTOR_CENTRALITY_MATCH_NE_TOPOLOGY_EQUIVALENCE
      - COMBINED_FIDELITY_OBJECTIVE_NE_COMPLETE_REPRESENTATION_PRESERVATION
      - TOPOLOGY_PRESERVING_LABEL_NE_UNBOUNDED_TOPOLOGY_PROOF
      - FIDELITY_REPORT_IDENTIFIES_TESTED_DIMENSIONS
      - FIDELITY_REPORT_IDENTIFIES_UNTESTED_DIMENSIONS_WHEN_MATERIAL
      - STRUCTURAL_METRIC_CLAIM_RETAINS_METRIC_CONVENTIONS_AND_SCOPE

  - id: ALIGN-011
    requirement: TRAINING_OBJECTIVE_IS_REPRESENTATION_PROVENANCE
    assertions:
      - TASK_PERFORMANCE_NE_INFORMATION_PRESERVATION
      - CLASSIFICATION_OPTIMIZED_INTEGRATION_NE_GENERAL_PURPOSE_FUSION
      - SUPERVISED_TOPOLOGY_WEIGHT_NE_INTRINSIC_TOPOLOGICAL_IMPORTANCE
      - OPTIMIZED_FOR_ONE_OBJECTIVE_NE_NEUTRAL_FOR_UNTESTED_OBJECTIVES
      - TASK_COUPLED_REPRESENTATION_IS_LABELED_AS_TASK_COUPLED_UNLESS_SEPARATELY_QUALIFIED

  - id: ALIGN-012
    requirement: REPRESENTATIVE_SUMMARY_DOES_NOT_ERASE_MATERIAL_DISSENT
    assertions:
      - CENTERED_TEMPLATE_NE_INSTANCE_STATE
      - REPRESENTATIVE_NE_COMPLETE
      - MINORITY_EVIDENCE_NE_ERROR
      - OUTLIER_NE_DISCARDABLE
      - MATERIAL_SOURCE_DISSENT_REMAINS_RECOVERABLE_WHERE_CONSEQUENTIAL
      - NOVEL_SAFETY_AUTHORITY_CONTINUITY_OR_FAULT_EVIDENCE_CAN_OVERRIDE_SUMMARY_COMPRESSION_RETENTION_HEURISTICS

  - id: ALIGN-013
    requirement: FEATURE_IMPORTANCE_AND_IMPLEMENTATION_LABELS_DO_NOT_EXCEED_OBSERVED_SUPPORT
    assertions:
      - DISCRIMINATIVE_FEATURE_NE_CAUSAL_MECHANISM
      - FEATURE_SELECTED_NE_FEATURE_TRUE
      - BIOMARKER_REPRODUCIBLE_NE_COGNITIVE_AUTHORITY
      - NAMED_BEHAVIOR_NE_VERIFIED_EXECUTION
      - PARTITION_OR_ROUTE_SPECIFIC_IMPLEMENTATION_CLAIM_REQUIRES_STATE_OR_INDEX_PATH_VERIFICATION

negative_tests:
  - ALIGNED_GRAPH_DOES_NOT_OVERWRITE_SOURCE_GRAPH_WITHOUT_LINEAGE
  - COMMON_REFERENCE_NODE_DOES_NOT_CREATE_UNPROVEN_ENTITY_IDENTITY
  - SOFT_CORRESPONDENCE_WEIGHT_IS_NOT_REPORTED_AS_IDENTITY_PROBABILITY_WITHOUT_CALIBRATION_AND_QUALIFICATION
  - HARD_NEAREST_REFERENCE_ASSIGNMENT_DOES_NOT_CREATE_ENTITY_IDENTITY
  - SUPER_RESOLVED_NODE_DOES_NOT_BECOME_OBSERVED_NODE
  - GENERATED_CROSS_MODAL_EDGE_DOES_NOT_BECOME_PHYSICAL_REACHABILITY
  - POOLING_DOES_NOT_DROP_ONLY_REVOCATION_OR_CONTINUITY_RECORD
  - CYCLE_CONSISTENT_TRANSFORM_DOES_NOT_GAIN_SEMANTIC_AUTHORITY
  - DISTRIBUTION_MATCHED_OUTPUT_DOES_NOT_GAIN_GROUND_TRUTH_STATUS
  - FEDERATED_WEIGHT_AVERAGE_DOES_NOT_OVERRIDE_SOURCE_DISAGREEMENT
  - MULTIPLE_REPLICAS_DESCENDING_FROM_ONE_SOURCE_DO_NOT_COUNT_AS_MULTIPLE_INDEPENDENT_CORROBORATIONS
  - GLOBAL_CENTER_CONVERGENCE_DOES_NOT_OVERWRITE_VALID_LOCAL_OR_EXCEPTION_EVIDENCE
  - META_ADAPTED_MODEL_DOES_NOT_RESUME_HIGH_CONSEQUENCE_EFFECT_AUTHORITY_WITHOUT_REQUIRED_REVALIDATION
  - ONE_HIGH_SCORING_SEED_DOES_NOT_ESTABLISH_STABLE_LEARNED_TOPOLOGY_WHEN_REASONABLE_PERTURBATIONS_FAIL
  - CLOSENESS_OR_OTHER_SINGLE_METRIC_MATCH_DOES_NOT_ASSERT_UNQUALIFIED_TOPOLOGY_PRESERVATION
  - EIGENVECTOR_CENTRALITY_MATCH_DOES_NOT_ASSERT_UNQUALIFIED_TOPOLOGY_EQUIVALENCE
  - COMPOUND_RECONSTRUCTION_CORRELATION_AND_CENTRALITY_OBJECTIVE_DOES_NOT_ASSERT_COMPLETE_REPRESENTATION_PRESERVATION
  - CLASSIFICATION_OPTIMIZED_FUSION_DOES_NOT_REPLACE_SOURCE_NATIVE_EVIDENCE_FOR_UNRELATED_COGNITIVE_TASKS
  - CENTERED_POPULATION_TEMPLATE_DOES_NOT_OVERWRITE_EXCEPTIONAL_INSTANCE_EVIDENCE
  - REPRODUCIBLE_DISCRIMINATIVE_FEATURE_DOES_NOT_BECOME_CAUSAL_OR_AUTHORITATIVE
  - CLUSTER_SPECIFIC_OR_MODALITY_SPECIFIC_LABEL_DOES_NOT_PASS_WITHOUT_RUNTIME_PARTITION_TRACE

references:
  - docs/architecture/REPRESENTATION_ALIGNMENT_AND_RESOLUTION.md
  - docs/architecture/REPRESENTATION_FIDELITY_AND_OBJECTIVE_PROVENANCE.md
  - docs/architecture/CONNECTIVITY_INFERENCE_AND_TOPOLOGY_EVIDENCE.md
  - docs/architecture/TEMPORAL_HYPERGRAPH_MODEL.md
  - docs/runtime/HYPERCONNECTOME_RUNTIME_MODEL.md
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - cognition/RELATIONAL_REASONING_AND_GRAPH_PRIORS.md
  - docs/research/BASIRA_ALIGNMENT_REPRODUCIBILITY_SCOUR_2026-09-09.md
  - docs/research/BASIRA_MULTIGRAPH_TOPOLOGY_FIDELITY_2026-09-09.md
  - docs/research/BASIRA_FEDERATED_REPLICA_AND_RELATIONAL_REASONING_2026-09-09.md
  - docs/research/BASIRA_SGNET_FIDELITY_CODE_REVIEW_2026-09-09.md